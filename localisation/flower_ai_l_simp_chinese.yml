 flower_need_hcp_600_tt:0 "国库现金储备不少于§Y600§!"
 flower_stk_dec_expand_slots:0 "重金征地扩建厂区（350储备）"
 flower_stk_dec_expand_slots_desc:0 "把支票往规划署长桌上一拍，批地、平整、通水通电一步到位，立刻多划出几块盖大厂的好地盘。"
 flower_stk_dec_expand_slots_tt:0 "扣除§Y350§!储备。"
 flower_stk_dec_build_civs:0 "民营财团包干民用工厂（500储备）"
 flower_stk_dec_build_civs_desc:0 "拿盈利直接请民营财团开工，省得自己排长队苦等，新的民用工厂很快就能亮灯运转啦。"
 flower_stk_dec_build_civs_tt:0 "扣除§Y500§!储备。"
 flower_stk_dec_build_mils:0 "军工巨头紧急扩建军用工厂（550储备）"
 flower_stk_dec_build_mils_desc:0 "军火巨头最听现款的话了——只要钱准时到账，新的军用工厂连夜就能架好流水线！"
 flower_stk_dec_build_mils_tt:0 "扣除§Y550§!储备。"
 flower_stk_dec_build_docks:0 "黄金海岸海军船坞扩建（450储备）"
 flower_stk_dec_build_docks_desc:0 "给沿海船务公司加足工期奖金，港口龙门吊转个不停，新的海军船坞很快就能下水造主力舰啦。"
 flower_stk_dec_build_docks_tt:0 "扣除§Y450§!储备。"
 flower_stk_dec_national_infra:0 "全国基础设施加速包干（300储备）"
 flower_stk_dec_national_infra_desc:0 "交通部盼这笔经费盼得眼睛都亮了——批下去之后，全国道路、基础设施和受损厂房一齐加速翻修。"
 flower_stk_dec_national_infra_tt:0 "扣除§Y300§!储备。"
 flower_stk_dec_fuel_synth:0 "合成炼油厂及储油罐工程（450储备）"
 flower_stk_dec_fuel_synth_desc:0 "请化工财团成套修建合成炼油厂与储油罐，以后开装甲师冲锋就不用老盯着油表发愁啦。"
 flower_stk_dec_fuel_synth_tt:0 "扣除§Y450§!储备。"
 flower_stk_dec_air_radar:0 "前沿空军基地与防空阵地包干（350储备）"
 flower_stk_dec_air_radar_desc:0 "出资把前线的空军基地和防空阵地铺好；要是已经点出无线电探测，工程师还会贴心帮你立起雷达站哦。"
 flower_stk_dec_air_radar_tt:0 "扣除§Y350§!储备。"
 flower_stk_dec_supply_corps:0 "重金雇佣筑路工程队（600储备）"
 flower_stk_dec_supply_corps_desc:0 "重金请来王牌铁道工程队——只要经费给到位，炮火底下照样把补给中心和铁路飞快铺到阵地后头！"
 flower_stk_dec_supply_corps_tt:0 "扣除§Y600§!储备。"

 #缴获蓝图破译所
 flower_devour_tech_cat:0 "§O缴获蓝图破译所§!"
 flower_devour_tech_cat_desc:0 "打赢敌国后，£research_icon §G基础特色科技§! 当场到手，更珍贵的图纸会先收进档案室慢慢破译：\n£special_project_texticon §Y高阶蓝图§!：§G1939年§! 自动攻克（§C1938年§! 起满足前置可调拨民用工厂与经验提前攻关）\n£special_project_breakthrough_texticon §R绝密蓝图§!：§G1941年§! 自动攻克（§C1940年§! 起满足高阶前置可调拨民用工厂与经验提前攻关）"

 flower_bp_dec_t2_pao:0 "【高阶蓝图】破译夜莺骑士团三阶"
 flower_bp_dec_t2_pao_desc:0 "从夜莺军团档案室摸回来的高阶魂灵操典，译员熬干三壶咖啡总算看懂门道啦。"
 flower_bp_dec_t2_kmk:0 "【高阶蓝图】破译二阶时停战车"
 flower_bp_dec_t2_kmk_desc:0 "红魔馆车库里拆下来的银怀表传动箱——真让人好奇装进自家坦克底盘会跑多快。"
 flower_bp_dec_t2_fra:0 "【高阶蓝图】破译幻想乡空降坦克"
 flower_bp_dec_t2_fra_desc:0 "给整辆坦克装上滑翔翼空投战场？听着怪离谱的，可幻想乡的图纸居然真的算平了配重！"
 flower_bp_dec_t2_sov:0 "【高阶蓝图】破译双联天启炮与综合后勤"
 flower_bp_dec_t2_sov_desc:0 "两门主炮并排架在同一座炮塔上——设计局看完沉默了三分钟，最后还是乖乖决定照着造出来。"
 flower_bp_dec_t2_dvl:0 "【高阶蓝图】破译魔导协同战术体系"
 flower_bp_dec_t2_dvl_desc:0 "把大坟墓那些绕口的魔导战术典籍，翻成普通步兵也能一眼看懂的实战操典啦。"
 flower_bp_dec_t2_ger:0 "【高阶蓝图】破译终极改良超重型坦克"
 flower_bp_dec_t2_ger_desc:0 "这张蓝图展开能铺满整张会议桌，真要试造样车，恐怕得先把车间大门再敲宽两米呢。"
 flower_bp_dec_t2_eng:0 "【高阶蓝图】破译二阶构装骑士与强袭魔女"
 flower_bp_dec_t2_eng_desc:0 "圣杯构装重甲配飞行魔导脚，不列颠藏得最深的王牌设计，如今乖乖躺在我们的绘图板上啦。"
 flower_bp_dec_t2_jap:0 "【高阶蓝图】破译樱花鬼王兵团"
 flower_bp_dec_t2_jap_desc:0 "一整列缴获的鬼王重甲原封不动运进试验场，冶金组正围着它逐块化验装甲配方呢。"
 flower_bp_dec_t2_mgu:0 "【高阶蓝图】破译天雷机甲与强袭魔女"
 flower_bp_dec_t2_mgu_desc:0 "魔法少女的机甲蓝图画得可真精致，连反应炉的每一根接线都标得清清楚楚。"
 flower_bp_dec_t2_paq:0 "【高阶蓝图】破译混沌恶魔与神选军团"
 flower_bp_dec_t2_paq_desc:0 "刚翻开这卷漆黑羊皮纸，整栋试验楼的灯泡齐刷刷闪了一下，吓得人后背直发凉……"
 flower_bp_dec_t2_pau:0 "【高阶蓝图】破译白夜滑翔空投舱"
 flower_bp_dec_t2_pau_desc:0 "白夜军团的空降滑翔舱方案，一落地就能直接展开作战，比传统降落伞狠多了。"
 flower_bp_dec_t2_pan:0 "【高阶蓝图】破译高阶圣遗物与圣枪圣盾"
 flower_bp_dec_t2_pan_desc:0 "圣遗物库房的密卷都收齐归档啦，军用工厂很快就能把圣枪和圣盾搬上流水线。"
 flower_bp_dec_t2_tur:0 "【高阶蓝图】破译二代机甲与火魔导使者"
 flower_bp_dec_t2_tur_desc:0 "拆完缴获的二代机甲外壳，研发组还顺藤摸瓜测出了整套火魔导核心，这波赚大啦。"
 flower_bp_dec_t2_usa_radar:0 "【高阶蓝图】破译相控阵与单脉冲尖端雷达"
 flower_bp_dec_t2_usa_radar_desc:0 "合众国列为最高机密的电子图纸，现在正安安静静摊在咱们实验室桌上呢。"
 flower_bp_dec_t2_autometa:0 "【高阶蓝图】破译高阶自律人偶全套"
 flower_bp_dec_t2_autometa_desc:0 "满桌精密发条和机械关节——等逆向复刻完毕，就能派出一支不知疲倦的自律人偶大军啦。"

 flower_bp_dec_t3_ufo:0 "【绝密蓝图】破译天外飞碟"
 flower_bp_dec_t3_ufo_desc:0 "档案室最深处翻出的碟形飞行器全套蓝图，空气动力学教授瞅了一眼就开始怀疑人生啦！"
 flower_bp_dec_t3_kmk:0 "【绝密蓝图】破译现代时停主战坦克"
 flower_bp_dec_t3_kmk_desc:0 "现代主战坦克车体加上红魔馆时停模块，装甲总监看完眼睛直放光，恨不得明天就开上阅兵场。"
 flower_bp_dec_t3_fra:0 "【绝密蓝图】破译早苗神风奇观炮"
 flower_bp_dec_t3_fra_desc:0 "炮口指到哪儿，哪儿连工事带敌军斗志一起没影的奇观火炮——这也太犯规啦！"
 flower_bp_dec_t3_sov:0 "【绝密蓝图】破译布拉蒂诺温压火箭"
 flower_bp_dec_t3_sov_desc:0 "一轮齐射就能把方圆几公里的空气抽干，躲进掩体里也躲不过这波热度。"
