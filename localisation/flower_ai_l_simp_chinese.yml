 FLWAI.29.a:0 "手气不错，稳稳收下！"
 FLWAI.29.d_opt:0 "见好就收，放弃状态直接折现"
 FLWAI.29.d_opt_tt:0 "移除本次摇出的180天正面状态，立刻入账£hcp_small 储备§G+350§!。"
 FLWAI.29.b:0 "忍180天，收下黑市封口费"
 FLWAI.29.b_tt:0 "保留当前负面状态180天，立刻获得£hcp_small 储备§G+150§!。"
 FLWAI.29.c:0 "花150储备贿赂老板重摇一次"
 FLWAI.29.c_tt:0 "花费£hcp_small 储备§R-150§!，立刻清除当前负面状态并重新摇一次命运骰子。"
 flower_gambler_roll_desc_1:0 "【欧皇附体！】\n哇，金色传说！\n\n持续180天：\n陆军师攻击+20%、陆军师防御+15%、突破+25%、陆军师速度+15%、计划速度+50%，并立即获得50点政治点数。"
 flower_gambler_roll_desc_2:0 "【天降横财！】\n黑市老板居然良心发现多发了一车原料，厂长笑得嘴都合不拢了。\n\n持续180天：\n工厂产出+25%、建设速度+25%、生活消费品工厂系数-15%、收入修正+50%，并立即入账300储备。"
 flower_gambler_roll_desc_3:0 "【灵光一闪，手搓奇迹！】\n科研院喝完浓茶突然顿悟，图纸画得飞起！\n\n持续180天：\n科研速度+30%、专项计划速度+75%、陆军经验增长+50%、每日指挥点数增长乘数+50%，并立即获得50点陆军经验与50点空军经验。"
 flower_gambler_roll_desc_4:0 "【命硬如铁，子弹拐弯！】\n也不知道哪路神仙在保佑，炮弹落下来愣是擦着钢盔边飞过去了。\n\n持续180天：\n陆军师组织度+20%、陆军组织度恢复+30%、补给消耗-25%、陆军师损耗-35%、每周人力+4000。"
 flower_gambler_roll_desc_5:0 "【手气发黑，债主上门！】\n杠杆加太猛爆仓了，财务处正连夜把厂里的铜线拆下来抵债……\n\n持续180天：\n生活消费品工厂系数+15%、工厂产出-15%、建设速度-15%、收入修正-25%。"
 flower_gambler_roll_desc_6:0 "【买到假货，枪管炸膛！】\n黑市老板卖的这批子弹一半是哑弹，前线士兵气得想把枪摔他脸上。\n\n持续180天：\n陆军师攻击-15%、突破-15%、陆军师损耗+20%、补给消耗+15%。"
 flower_gambler_roll_desc_7:0 "【参谋喝假酒，地图拿反了！】\n前线发来急电：司令部下达的穿插路线画到自家后院去了！\n\n持续180天：\n陆军师组织度-15%、计划速度-35%、陆军师速度-10%、移动中组织度损失+25%。"
 flower_gambler_roll_desc_8:0 "【黑料曝光，全线吃瓜！】\n报纸头版全在扒黑市交易的内幕，科研院和内阁全跑去吃瓜摸鱼了。\n\n持续180天：\n稳定度-10%、战争支持度-10%、科研速度-15%、政治点数-20%。"

