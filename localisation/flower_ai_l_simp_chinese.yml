 FLOWER_ANOMALY_CARD_1_TT:0 "§Y大家一起来抽卡§!\n§L打仗哪有抽卡香！§!\n--------------\n开局从12条核心流派中择一起步。\n此后§G每6个月§!开启1轮随机词条抽取，§G每年§!空投1张免费验牌券与战备补给箱；首次与主要国家开战时额外获赠免费验牌券与§Y200HCP§!战备金。\n世界列强亦会择定流派，每半年抽取词条并编练对应主力参战。"
 FLOWER_ANOMALY_CARD_2_TT:0 "§O谁也别想蹲战壕§!\n§L工兵铲全没收！§!\n--------------\n£dig_in_max_texticon 堑壕上限：§R-100%§!\n£cn_attacker_speed_texticon 陆军师速度：§G+25%§!\n£planning_speed_texticon 计划速度：§G+100%§!\n£army_morale_texticon 陆军师组织度恢复速率：§G+50%§!\n£org_loss_when_moving_texticon 移动中组织度损失：§G-25%§!\n£naval_invasion_time_texticon 登陆准备时间：§G-75%§!\n在战争中使主要国家或工厂数不少于15的敌国停止抵抗时（冷却90天），触发【闪电五连鞭】战利品事件，首次触发永久获得【闪电急先锋】（速度+25%、突破+25%、补给范围+25%、移动组织度损失-25%、包围惩罚-20%）。"
 FLOWER_ANOMALY_CARD_3_TT:0 "§Y老实赚钱很枯燥吧§!\n§L赢了会所嫩模，输了下海干活！§!\n--------------\n£hcp_small 开局储备：§G+500§!、收入修正：§G+25%§!\n£consumer_goods_texticon 生活消费品工厂系数：§G-10%§!\n£funds_texticon 军工机构经费获取：§G+50%§!、贸易影响力系数：§G+50%§!\n开启【久留美全球交易所】（四只股票可买涨、借钱翻倍买或押钱赌跌，手头满500储备可直接盖军用工厂与民用工厂各1座），每年初还会遇上年度大行情；世界列强也会下场买卖带节奏。"
 FLOWER_ANOMALY_CARD_4_TT:0 "§O这是什么？能吃吗？§!\n§L……什么图瓦？能吃吗？§!\n--------------\n开局开启1轮12大流派选秀。\n此后每当在战争中击败或吞并非内战敌国，都会§Y直接吞下该国独有的特殊科技、专属模块与特色兵种§!，并把败者之前吃进肚里的成果一并收走。\n击败主要国家或工业强国时，永久叠加1层【吃饱长高高】（每层攻防突破+2.5%、工厂产出+5%、非核心人力+5%、每周人力+1000）并开席挑选战利品。"
 FLOWER_ANOMALY_CARD_5_TT:0 "§1神仙将领下凡间§!\n§L教皇？他有几个师？§!\n--------------\n£leader_experience_gain_texticon 指挥官经验增长：§G+200%§!\n£command_power_texticon 每日指挥点数增长乘数：§G+100%§!\n£command_power_max_texticon 最大指挥点数提高：§G+100§!\n£army_leader_cost_texticon 陆军指挥官花费：§G-75%§!\n开局及局中定期召开【将星武道会】，把手底下将领练成身怀绝活的名帅。"
 FLOWER_ANOMALY_CARD_6_TT:0 "§R压力怪的狂欢夜§!\n§L你的胆子真是肥嘟嘟的。§!\n--------------\n自动开启【大家一起来抽卡】，且全部§YAI国家§!获得强化：\n  £attack_texticon 陆军师攻击：§R+15%§!、£defence_texticon 陆军师防御：§R+15%§!\n  £civ_factory_output 工厂产出：§R+20%§!、£research_speed_texticon 科研速度：§R+15%§!\n各主要AI每轮多抽一次流派阶位，中后期坐大的强敌还会亮出【终局大魔王二阶段】。\n§G★弑神者悬赏§!：战时击败任意AI主要国家，立即获得§Y+500HCP§!、人力§G+80000§!、陆空经验各§G+100§!、《记仇小本本》§G+2层§!、免费验牌券§G+1§!，并多抽1轮词条。"
 FLOWER_ANOMALY_CARD_7_TT:0 "§R三军听令，自刎归天！§!\n§L三军听令，自刎归天！§!\n--------------\n各国常驻投降界限§G+5%§!，并按战局触发§Y骄兵必败、哀兵必胜§!：\n§R【骄兵必败】§!战时投降倾向低于5%且占领敌方3个地区以上：组织度恢复速率§R-20%§!、堑壕上限§R-25%§!、突破§R-10%§!。\n§G【哀兵必胜】§!投降倾向超20%／40%／60%逐级提高核心领土攻防（最高§G+30%§!）、突破（最高§G+25%§!）、组织度恢复速率（最高§G+50%§!）与补给消耗§G-25%§!。\n§Y【战时指令】§!耗25政治点数开启30天死战冲锋（陆军师攻击与突破§G+25%§!、组织度恢复速率§G+30%§!、移动中组织度损失§G-50%§!），打完进入60天【强弩之末】（冷却180天）。\n§O★败走麦城§!：每当主要国家投降或灭亡，响起《关羽之歌》为其送行。"
 FLOWER_ANOMALY_CARD_8_TT:0 "§Y我是爷们儿！§!\n§L大喊一声，我是爷们儿！§!\n--------------\n各国部队死扛到底，被包饺子也不虚：\n  非战斗补给耗尽惩罚：§G-50%§!、包围惩罚：§G-50%§!\n  陆军师组织度：§G+15%§!、战争支持度：§G+15%§!\n  撤退速度：§R-30%§!\n§G【打肿脸充胖子】§!战时可在决议栏§G0消耗§!吼一嗓子（冷却120天），开启60天反击：核心领土攻防§G+15%§!、陆军师防御§G+15%§!、组织度恢复速率§G+25%§!、稳定度§G+10%§!。"
 FLOWER_ANOMALY_CARD_9_TT:0 "§G全员拼好饭§!\n§L拼好饭，吃就完了！§!\n--------------\n军工采购全面拼单降价，便宜管饱但质量看脸：\n  步炮坦机等主力装备造价：§G-25%§!、生活消费品工厂系数：§G-10%§!\n  装备可靠性：§R-20%§!、陆军师损耗：§R+25%§!、陆军师防御：§R-15%§!\n§Y【每90天战地外卖盲盒】§!每90天换一盒战地外卖：\n  §G满减加鸡腿§!（90天）：补给消耗-25%、陆军师速度+15%、组织度恢复速率+20%\n  §O科技与狠活§!（90天）：陆军师攻击+20%、陆军师损耗+25%\n  §Y骑手超时免单§!（90天）：生活消费品工厂系数-10%、收入修正+25%、突破+15%、陆军师组织度-10%"
 FLOWER_ANOMALY_CARD_10_TT:0 "§C从从容容，连滚带爬§!\n§L本来应该从从容容，游刃有余。§!\n--------------\n§G【和平：从从容容】§!建设速度§G+20%§!、科研速度§G+15%§!、政治点数§G+20%§!；计划速度§R-25%§!、堑壕上限§R-25%§!。\n§O【开战：连滚带爬】§!开打后转入战时体制（常驻撤退速度§G+15%§!、工厂修复§G+25%§!），并慌乱90天：稳定度§R-10%§!、陆军师防御§R-10%§!，陆军师速度§G+25%§!、撤退速度§G+30%§!、工厂产出§G+20%§!。\n§Y【连夜扛厂炸路】§!带工厂的核心地区失守时（冷却60天），当场拆走1座工厂搬回后方核心地区重建，顺手把当地铁路与基础设施各炸毁2级！"
 FLOWER_ANOMALY_CARD_11_TT:0 "§1孩子们，我回来了§!\n§L孩子们，我回来了。§!\n--------------\n各国开局直接解锁基础伞兵、海军陆战队与运输船科技：\n  登陆准备时间：§G-75%§!、两栖登陆速度：§G+30%§!、夺取制空权任务效率：§G+25%§!\n  空军航程：§G+50%§!、特种部队容量上限乘数：§G+50%§!、空降后的组织度：§G+50%§!、伞兵携行补给：§G+120小时§!\n§R【防空打坠机】§!防空阵地建设速度§G+50%§!、地区防空命中与防空炮对空攻击§G+50%§!，空军事故几率§R+50%§!、恶劣天气惩罚§R+50%§!！"
 FLOWER_ANOMALY_CARD_12_TT:0 "§Y回答我！看着我！§!\n§L回答我！Look in my eyes！§!\n--------------\n各国情报全透明，谁也别想藏底牌：\n  侦查：§G+25%§!、协同性：§G+10%§!、科研速度：§G+10%§!\n  特工位：§G+1§!、情报网增长：§G+100%§!、情报机构升级时间：§G-50%§!\n  破译能力：§G+30§!且§G+100%§!、解密：§G+50%§!、四项基础情报：§G+50%§!、从战斗获取的情报：§G+100%§!\n§O【破城灵魂拷问】§!攻陷敌方首都或大城市时（冷却90天）：守方陷入60天§R【被问到哑口无言】§!（稳定度-10%、加密-5、陆军师防御-10%、组织度恢复速率-15%），攻方立刻拿到1张§G+50%科研加速卡§!！"
