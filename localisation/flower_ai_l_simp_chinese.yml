 FLWAI.29.d:0 "[GetFlowerGamblerFateDesc]"
 FLWAI.29.a:0 "哇手气不错，稳稳收下！"
 FLWAI.29.d_opt:0 "见好就收，退掉状态直接折现"
 FLWAI.29.d_opt_tt:0 "移除本次摇出的180天正面状态，立刻入账£hcp_small 储备§G+350§!。"
 FLWAI.29.b:0 "忍这180天，拿上封口费走人"
