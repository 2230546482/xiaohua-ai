 flower_op_corp_mil_plan_idea:0 "§O半年军用工厂扩产指标§!"
 flower_op_corp_mil_plan_idea_desc:0 "各地军工产区进入半年扩产考核期，180天内达成军用工厂目标即可兑现履约红利。"
 flower_op_corp_civ_plan_idea:0 "§C半年民用工业建设指标§!"
 flower_op_corp_civ_plan_idea_desc:0 "全国基建工地进入半年扩建考核期，180天内达成总工厂数目标即可兑现履约红利。"
 flower_op_corp_eff_plan_idea:0 "§G半年生产效率冲刺§!"
 flower_op_corp_eff_plan_idea_desc:0 "把车间里拖后腿的旧工序全理顺了，整条产线跑起来轻快了一大截。"
 flower_op_arty_barrage_idea:0 "§R饱和弹幕总攻§!"
 flower_op_arty_barrage_idea_desc:0 "炮兵观测员只报了一个坐标——前面整片战区。至于弹药库存，打完这轮再算账！"
 flower_op_tank_timestop_idea:0 "§C银怀表：时停穿插§!"
 flower_op_tank_timestop_idea_desc:0 "敌军哨兵还在揉眼睛，我们的先导坦克早就从对面指挥部窗外呼啸着溜过去啦~"
 flower_op_air_carpet_idea:0 "§t全空域断后勤洗地§!"
 flower_op_air_carpet_idea_desc:0 "天上全是我们的机翼影子，对面哪怕只溜出一辆补给卡车，都能引来一整队俯冲轰炸机。"
 flower_op_wave_expand_idea:0 "§O总动员姿态：疯狂扩军令§!"
 flower_op_wave_expand_idea_desc:0 "征兵站排起长队，新兵领到步枪练上几周就开赴前线，绝不让战线漏出半寸空档。"
 flower_op_wave_hold_idea:0 "§R总动员姿态：寸土不让督战§!"
 flower_op_wave_hold_idea_desc:0 "督战队的机枪已经架在二线战壕口啦——前方是敌军，身后是督战队，自己挑一边吧。"
 flower_op_wave_rest_idea:0 "§G总动员姿态：后方轮战整补§!"
 flower_op_wave_rest_idea_desc:0 "把打光弹药的部队先撤回后方吃口热饭、睡个好觉，省下来的补给留给下一场硬仗。"
 flower_op_nightingale_raid_idea:0 "§1子夜奇袭突击§!"
 flower_op_nightingale_raid_idea_desc:0 "太阳落山，才是夜战部队的上班时间！"
 flower_op_guerrilla_sabotaged_idea:0 "§R深陷敌后游击破坏§!"
 flower_op_guerrilla_sabotaged_idea_desc:0 "昨晚刚修好的铁轨今早又断了，前线运粮车队堵在山谷里急得团团转。"
 flower_op_undead_surge_idea:0 "§R敢死队姿态：急救伤兵归队§!"
 flower_op_undead_surge_idea_desc:0 "野战医院的担架几乎没沾过地，轻伤员包扎完转身就问军需官自己的步枪放哪啦。"
 flower_op_undead_armor_idea:0 "§1敢死队姿态：死守钢铁阵地§!"
 flower_op_undead_armor_idea_desc:0 "哪怕炮弹把战壕犁上几千遍，我们的人也一步不退。"
 flower_op_undead_labor_idea:0 "§Y敢死队姿态：后方连夜赶工§!"
 flower_op_undead_labor_idea_desc:0 "后方厂房的机器彻夜不熄火，全城都在为前线的下一轮反攻赶造弹药和钢材。"
 flower_op_undead_overdrive_idea:0 "§R敢死队拼死强攻§!"
 flower_op_undead_overdrive_idea_desc:0 "最后一批预备队全部押上主攻方向，全军憋着一口气硬冲六十天！"
 flower_op_magic_steady_idea:0 "§C特种调令：特种扩训科研§!"
 flower_op_magic_steady_idea_desc:0 "特战教官一边扩训新兵，一边把前线总结的实战门道送回科研院画成新图纸。"
 flower_op_magic_overload_idea:0 "§R特种调令：精锐强攻§!"
 flower_op_magic_overload_idea_desc:0 "把最精锐的特战尖刀全都推上主攻方向：哪怕损耗翻倍，也要在期限内撕开缺口！"
 flower_op_punk_forest_idea:0 "§G实验室课题：全地形隐蔽防护§!"
 flower_op_punk_forest_idea_desc:0 "新配发的伪装网和模块化掩体让部队藏得严严实实，钻进烂地形也丝毫不显狼狈。"
 flower_op_punk_ufo_idea:0 "§t实验室课题：设计局加班赶工§!"
 flower_op_punk_ufo_idea_desc:0 "咖啡壶煮干了第八回，设计局的图纸总算赶在敌军换装前抢先送进兵工厂啦~"
 flower_bm_arms_supply_idea:0 "§R黑市军火急运契约§!"
 flower_bm_arms_supply_idea_desc:0 "半年的净收入换来一列没有番号的神秘军列，箱子里全是前线求之不得的尖货。"
 flower_bm_industry_boost_idea:0 "§Y黑市工业加急契约§!"
 flower_bm_industry_boost_idea_desc:0 "别问这批精密机床和稀缺合金是从哪国海关溜出来的，装上车间它们转得比谁都欢。"
 flower_bm_intel_tech_idea:0 "§C黑市图纸情报契约§!"
 flower_bm_intel_tech_idea_desc:0 "重金从暗网淘来的敌国蓝图与密码线索，直接替科研院省下好几年弯路呢。"
 flower_bm_vip_jackpot_idea:0 "§1黑市大客户对赌契约§!"
 flower_bm_vip_jackpot_idea_desc:0 "豪赌赢下的地下黑市头等大礼——前线弹药管够，后方产线也跟着一路狂飙！"
 flower_enemy_timestopped_idea:0 "§R阵脚遭闪电穿插打乱§!"
 flower_enemy_timestopped_idea_desc:0 "敌军装甲集群突然插进了后方通信枢纽，各师收到的命令互相打架，前线乱成一锅粥。"
 flower_enemy_airspace_crushed_idea:0 "§R制空权遭全面压制§!"
 flower_enemy_airspace_crushed_idea_desc:0 "前线空军基地接连遇袭，战机刚滑出跑道就被按在地上，陆军完全暴露在敌机俯冲之下。"
 flower_enemy_intel_blind_idea:0 "§R战区电台遭夜战破译§!"
 flower_enemy_intel_blind_idea_desc:0 "密码本已被敌方夜战部队顺手牵羊，天一黑电台里到处漏风，命令总比对面慢上半拍。"
 flower_night_first_strike_idea:0 "§1开战夜袭先机§!"
 flower_night_first_strike_idea_desc:0 "趁对手刚转入战时体制还没回过神来，夜战部队借着夜色先手猛击三十天！"
 flower_dvl_ward_shield_idea:0 "§G超位魔法结界反制抢修§!"
 flower_dvl_ward_shield_idea_desc:0 "防空结界硬生生偏转了前两处核心落点，全国抢修队正连夜修复外围被余波震裂的厂房。"
 flower_proto_antigrav_tracks_idea:0 "§C实验原型：轻量化高速履带§!"
 flower_proto_antigrav_tracks_idea_desc:0 "轻质复合材料履带让坦克跑得像飙车一样快，唯一的代价是油箱见底也快了一截。"
 flower_proto_ammo_printer_idea:0 "§O实验原型：战地弹药速造车间§!"
 flower_proto_ammo_printer_idea_desc:0 "把弹药车间直接装在卡车底盘上跟着炮兵走，弹药管够，就是精密设备在泥地里略微娇气。"
 flower_proto_weather_ctrl_idea:0 "§t实验原型：气象观测干预阵§!"
 flower_proto_weather_ctrl_idea_desc:0 "我军头顶晴空万里，敌军战区却连下九十天暴雨——气象局坚称这纯属巧合~"
 flower_enemy_bad_weather_idea:0 "§R战区异常暴雨浓雾§!"
 flower_enemy_bad_weather_idea_desc:0 "前线连日暴雨夹着浓雾，公路全泡成了泥潭，空军基地里没有一架飞机能顺利起飞。"
 flower_proto_super_wargame_idea:0 "§1实验原型：自动化沙盘推演机§!"
 flower_proto_super_wargame_idea_desc:0 "屋里摆满咔哒作响的机械齿轮和打孔纸带，通宵替总参谋部把前线战局推演了个遍。"
 flower_proto_micro_reactor_idea:0 "§G实验原型：紧凑型核能动力炉§!"
 flower_proto_micro_reactor_idea_desc:0 "那座嗡嗡低鸣的小型反应堆悄悄接进了电网，后勤处还没搞懂原理，但电费账单确实薄了一大截。"

