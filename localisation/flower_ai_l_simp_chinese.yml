#开局畸变7-12文案
 flower_anom7_base_idea:0 "三军听令，自刎归天！"
 flower_anom7_base_idea_desc:0 "顺风顺水时最容易飘，逼到悬崖边反而能打出惊人血性。每当主要国家在非内战战争中战败覆灭，天下都会响起《关羽之歌》送它最后一程。"
 flower_anom7_arrogant_idea:0 "骄兵冒进"
 flower_anom7_arrogant_idea_desc:0 "连克数城之后，参谋部里提前开了香槟——部队冲得飞快，就是谁都没耐心认真挖战壕。"
 flower_anom7_desperate_1_idea:0 "哀兵初醒"
 flower_anom7_desperate_1_idea_desc:0 "第一座边境城市失守后，指挥部里的香槟杯总算没人再举起来啦。"
 flower_anom7_desperate_2_idea:0 "背水一战"
 flower_anom7_desperate_2_idea_desc:0 "地图上能往后画的箭头越来越少，前线官兵索性把撤退方案烧了个干净。"
 flower_anom7_desperate_3_idea:0 "自刎归天前夜"
 flower_anom7_desperate_3_idea_desc:0 "敌军先头部队都已经望见首都钟楼啦——要么从这儿杀回去，要么就只剩那曲送行的《关羽之歌》咯。"
 flower_anom7_exhausted_idea:0 "强弩之末"
 flower_anom7_exhausted_idea_desc:0 "孤注一掷的冲锋把最后一点力气也榨干啦，部队和补给线都得歇上一阵子。"
 flower_anom8_base_idea:0 "我是爷们儿！"
 flower_anom8_base_idea_desc:0 "断粮不慌，被围不怂——至于撤退？硬汉的词典里可从来没有这一页！"
 flower_anom8_boast_idea:0 "打肿脸充胖子"
 flower_anom8_boast_idea_desc:0 "嗓门先压倒对面再说！不管账面局势多难看，阵脚绝不松动半步。"
 flower_anom9_base_idea:0 "全员拼好饭"
 flower_anom9_base_idea_desc:0 "全国军工采购全员拼单砍价：装备和战机便宜得离谱，就是出厂质量全凭手气；每90天还会准点送达一盒战地外卖。"
 flower_anom9_meal_chicken_idea:0 "满减加鸡腿"
 flower_anom9_meal_chicken_idea_desc:0 "今天这盒战地拼好饭居然真的多塞了只大鸡腿，全军士气肉眼可见地涨了一大截~"
 flower_anom9_meal_tech_idea:0 "科技与狠活"
 flower_anom9_meal_tech_idea_desc:0 "配料表印得比作战命令还密，吃完浑身有使不完的力气，就是装备和人手损耗得也格外快。"
 flower_anom9_meal_late_idea:0 "骑手超时免单"
 flower_anom9_meal_late_idea_desc:0 "骑手超时直接免单，财政部笑开了花；前线饿着肚子憋了一股火猛冲敌阵，只是队形散了些。"
 flower_anom10_calm_idea:0 "从从容容，游刃有余"
 flower_anom10_calm_idea_desc:0 "太平岁月里搞建设、做科研、批公文样样从容不迫，就是压根没人正经备战。"
 flower_anom10_panic_idea:0 "匆匆忙忙，连滚带爬"
 flower_anom10_panic_idea_desc:0 "第一发炮弹落地才想起来翻动员令——阵脚虽然乱作一团，可撤退和进厂赶工的速度倒是谁也追不上！"
 flower_anom10_war_idea:0 "战时迁厂体制"
 flower_anom10_war_idea_desc:0 "核心工业区一旦失守，工人会连夜拆走1座工厂运回后方重建，顺手把当地铁路和基础设施各炸毁2级，一根枕木也不留给对面。"
 flower_anom11_base_idea:0 "孩子们，我回来了"
 flower_anom11_base_idea_desc:0 "伞兵和登陆队随时可以起飞登船，不过漫山遍野的防空阵地和坏天气也让每一次升空都惊险万分。"
 flower_anom12_base_idea:0 "回答我！看着我！"
 flower_anom12_base_idea_desc:0 "各国底牌几乎摊在明面上，谁也藏不住小秘密。打下敌方首都或大城市时，还能当面灵魂拷问，把对手参谋部直接问到哑口无言！"
 flower_anom12_speechless_idea:0 "被问到哑口无言"
 flower_anom12_speechless_idea_desc:0 "核心大城刚丢就被指着鼻子公开质问，内阁和总参谋部一时语塞，连密码本都乱了套。"
 flower_anom12_interrogate_tech_bonus:0 "灵魂拷问审出的技术资料"
 flower_anomaly_v2_ops_cat:0 "畸变战时指令"
 flower_anomaly_v2_ops_cat_desc:0 "本局已开启特殊世界法则，打到关键节点别忘了来这儿按指令。"
 flower_anom7_ziwen_charge_dec:0 "三军听令，自刎归天！"
 flower_anom7_ziwen_charge_dec_desc:0 "“那就容我告老还乡了。”"
 flower_anom8_yemen_roar_dec:0 "大喊：我是爷们儿！"
 flower_anom8_yemen_roar_dec_desc:0 "“坦克是没有后视镜的！”"
 flower_sfx_anomaly_7_ziwen:0 "自刎归天原声音效"
 flower_sfx_anomaly_7_guanyu_song:0 "关羽之歌送行音效"
 flower_sfx_anomaly_8_yemen:0 "吴京我是爷们儿原声音效"
 flower_sfx_anomaly_9_pinhaofan:0 "拼好饭开盒音效"
 flower_sfx_anomaly_10_congrong:0 "从从容容连滚带爬原声音效"
 flower_sfx_anomaly_11_manba:0 "Man What can I say音效"
 flower_sfx_anomaly_12_look_eyes:0 "回答我Look in my eyes原声音效"
 flower_pao_player_lhs_win_idea:0 "拉普拉塔革命烽火"
 flower_pao_player_lhs_win_idea_desc:0 "拉普拉塔内战正酣，野火阵线士气正旺，压着旧军团一路猛打。"
 flower_pao_player_pau_yield_idea:0 "拉普拉塔军心溃散"
 flower_pao_player_pau_yield_idea_desc:0 "内战各线腹背受敌，军团后勤和指挥乱作一团。"

 #股市盈利建设：基建与工业大包干
 flower_stock_infra_cat:0 "§Y基建与工业大包干§!"
 flower_stock_infra_cat_desc:0 "赚来的储备堆在金库里又不会自己下崽！直接签支票外包给工程队：\n£slot_texticon 扩建地区最大工厂数   £civ_factory 民用工厂   £mil_factory 军用工厂   £dockyard_texticon 海军船坞\n£construction_speed_infrastructure_texticon 基础设施   £construction_speed_refinery_texticon 合成炼油厂与储油罐   £construction_speed_airbase_texticon 空军基地与防空阵地   £supply_hub_texticon 补给中心与铁路"
 flower_stk_infra_rush_idea:0 "全国基础设施加速包干"
 flower_stk_infra_rush_idea_desc:0 "预算给足之后，全国施工队连夜三班倒，修路建厂和战损修复一起提速。"
 flower_stk_supply_corps_idea:0 "重金聘请铁道工程队"
 flower_stk_supply_corps_idea_desc:0 "只要经费按时到账，就算炮弹落在铁轨边上，这群铁道老手照样能把补给中心和铁路准点铺进前线！"
 flower_need_hcp_300_tt:0 "国库现金储备不少于§Y300§!"
 flower_need_hcp_350_tt:0 "国库现金储备不少于§Y350§!"
 flower_need_hcp_450_tt:0 "国库现金储备不少于§Y450§!"
 flower_need_hcp_500_tt:0 "国库现金储备不少于§Y500§!"
