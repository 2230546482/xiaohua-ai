#民族精神
red_apocalypse_player:0 "§R《直至最后一个阵地》§!"
red_apocalypse_player_desc:0 "“指挥官……能听见吗？第三防线已经彻底塌了……到处都是火，到处都是血……他们根本杀不完，倒下一个又压上来十个！大家、大家都已经不动了……回答我，回答我啊……！”\n\n头顶的天空早就被呼啸的敌机和黑烟彻底遮死，后方的公路和补给点早已被炮火炸成了焦坑。子弹打光了，我们的装甲燃着大火陷在了火焰之中，退路早已荡然无存。就算拼死包围了他们孤立的部队，那些家伙也根本不会慌乱，反而会面无表情地反扑过来，把我们的阵地连同合围的部队一起撕碎。这里早已没有任何奇迹，我们只能在绝望的深潭里眼睁睁看着自己被一点一点碾碎。\n\n§R“……指挥官，不要再派增援过来了，求求你……别让其他人再来送死了。我枪里还剩最后一颗子弹，在他们冲进来之前……这是我能守住的，最后一个阵地了。”§!"
red_apocalypse_ai:0 "§R《直至最后一个阵地》§!"
red_apocalypse_ai_desc:0 "“指挥官……能听见吗？第三防线已经彻底塌了……到处都是火，到处都是血……他们根本杀不完，倒下一个又压上来十个！大家、大家都已经不动了……回答我，回答我啊……！”\n\n头顶的天空早就被呼啸的敌机和黑烟彻底遮死，后方的公路和补给点早已被炮火炸成了焦坑。子弹打光了，我们的装甲燃着大火陷在了火焰之中，退路早已荡然无存。就算拼死包围了他们孤立的部队，那些家伙也根本不会慌乱，反而会面无表情地反扑过来，把我们的阵地连同合围的部队一起撕碎。这里早已没有任何奇迹，我们只能在绝望的深潭里眼睁睁看着自己被一点一点碾碎。\n\n§R“……指挥官，不要再派增援过来了，求求你……别让其他人再来送死了。我枪里还剩最后一颗子弹，在他们冲进来之前……这是我能守住的，最后一个阵地了。”§!"
