#流派主动运营交互事件、黑市契约、实验原型机与魔导国21天预警事件（严格零颜色码）
 FLWAI.31.t:0 "【大基建】下达半年生产指标"
 FLWAI.31.d:0 "计划委员会把未来半年的三套工业指标摆上了长桌。\n\n若接下军用工厂或民用工业扩建指标，180天到期达标就能直接验收额外厂房与《基建狂魔的流水账》层数；要是各地空地已经快盖满了，也可以直接选生产效率冲刺，稳稳把眼前收益落袋。"
 FLWAI.31.a:0 "军用工厂扩产指标（180天内新增3座军用工厂）"
 FLWAI.31.a_tt:0 "§G180天到期时，若军用工厂数量比当前增加至少3座：§!\n首都新建§G2座军用工厂§!与§G1座民用工厂§!\n《基建狂魔的流水账》：§G+1层§!、£hcp_small 储备：§G+200§!"
 FLWAI.31.b:0 "民用工业建设指标（180天内工厂总数新增4座）"
 FLWAI.31.b_tt:0 "§G180天到期时，若全国工厂总数比当前增加至少4座：§!\n首都新建§G3座民用工厂§!\n《基建狂魔的流水账》：§G+1层§!、£hcp_small 储备：§G+200§!"
 FLWAI.31.c:0 "生产效率冲刺（不设考核，立即叠层并领150储备）"
 FLWAI.37.t:0 "【大基建】半年生产指标验收"
 FLWAI.37.d_win:0 "统计局的验收专员一早送来了红头喜报：过去半年的扩建指标已经超额完成。\n\n各厂区的配套厂房与追加拨款都已准备妥当，只要您签下字，就能立刻并入国家产能。"
 FLWAI.37.d_fail:0 "半年考核期已到，受限于战局变动与原料周转，这一轮新增工厂数没能踩上预定指标。\n\n几位厂长低着头递上检讨书，只从结余账目里退回了一小笔资金。"
 FLWAI.37.a:0 "超额达标！验收新厂并入账！"
 FLWAI.37.b:0 "算了，下一轮再接着盖。"
 FLWAI.32.t:0 "【督战队人海】切换战时总动员姿态"
 FLWAI.32.d:0 "总参谋部请示本阶段的动员姿态。三种姿态互斥，可根据前线压力与兵源余量随时调整：缺人就急征新兵，吃紧就死守阵地，打累了便轮换休整。"
 FLWAI.32.a:0 "疯狂扩军令（可征募人口、陆军师训练时间与每周人力）"
 FLWAI.32.b:0 "寸土不让督战（陆军师核心领土防御、增援率与老兵保全）"
 FLWAI.32.c:0 "后方轮战整补（陆军师组织度恢复速率、补给消耗与陆军师损耗）"
 FLWAI.33.t:0 "【战地敢死队】战地动员方案"
 FLWAI.33.d:0 "前线急救站与后备营已经整备完毕，军需官正在等候指令。\n\n这一轮是优先把轻伤员抢救归队、抽调兵力死守阵地，还是组织后方车间连夜赶工？"
 FLWAI.33.a:0 "急救伤兵归队（补40000人力、步兵装备与120天高恢复）"
 FLWAI.33.b:0 "死守钢铁防线（150天陆军师防御、HP与陆军师组织度）"
 FLWAI.33.c:0 "后方连夜赶工（150天工厂产出、建设速度与生活消费品工厂系数）"
 FLWAI.33.e:0 "拼死强攻（耗20000人力与4%稳定度换60天猛攻）"
 FLWAI.34.t:0 "【王牌特种兵团】特种司令部调令"
 FLWAI.34.d:0 "特种司令部送来本周期的整训计划。\n\n稳妥起见可以兼顾扩训与科研立项，急需破局也可以下达精锐强攻令立刻抽出装备与火力。"
 FLWAI.34.a:0 "特种扩训与科研（150天强化科研与特种容量，附送突破点）"
 FLWAI.34.b:0 "精锐强攻令（耗资金或政治点数与稳定度换强攻和装备）"
 FLWAI.34.c:0 "全地形王牌特训（现役将领加属性并学地形特质）"
 FLWAI.35.t:0 "【疯狂科研实验室】实验室专项课题"
 FLWAI.35.d:0 "工程防护组与军工机构代表同时堵在了院长室门口，两拨人都说自己的课题最急。这笔专项经费，先拨给哪一边？"
 FLWAI.35.a:0 "全地形隐蔽防护（150天减免密接支援伤害与损耗，提高防御）"
 FLWAI.35.b:0 "设计局加班赶工（150天加快科研、军工机构经费与空战效率）"
 FLWAI.36.t:0 "【黑市轮盘】黑市赌桌筹码操作"
 FLWAI.36.d:0 "黑市老板摇着手里的骰盅冲你挑了挑眉。\n\n这回是花点小钱买份包赢保险洗掉晦气，还是趁手热再加倍重摇一发？"
 FLWAI.36.a:0 "购买黑市保险（清除负面状态且下次必出正面）"
 FLWAI.36.a_tt:0 "§G已激活【黑市保底保险】：下一次触发命运骰子时100%只会抽到正面状态！§!"
 FLWAI.36.b:0 "加倍重摇一发（立即重投并领经验、政治点数与火炮）"
 FLWAI.36.c:0 "把负面命运骰子甩给交战敌国"
 FLWAI.36.c_tt:0 "将你身上的负面命运骰子立刻清除，并转嫁给1个随机交战敌国持续120天。"
 FLWAI.36.e:0 "砸250储备买雇佣兵、装备与加速卡"
 FLWAI.36.e_tt:0 "花费250储备，立刻获得40000人力、4000步兵装备、400牵引式火炮与1张100%科研加速卡。"
 FLWAI.25.a_stock_tt:0 "§G【坐庄拉盘】：全球股市立刻进入大牛市，【军工防务】股价当场上涨+25%、【基建重工】上涨+20%！§!"
 FLWAI.25.b_stock_tt:0 "§R【空头砸盘】：全球股市立刻触发熔断暴跌，【科技飞碟】与【黑市期货】股价当场下挫-25%（持有空单可大赚一笔）！§!"
 FLWAI.25.e_stock_tt:0 "§Y【内幕消息】：锁定下月风向为【军工防务看涨】，并立即重置交易所盈利购厂冷却！§!"
 FLWAI.38.t:0 "嘎嘣脆，鸡肉味！大胃王进化盛宴！"
 FLWAI.38.d:0 "又一个强敌在我们的攻势下彻底倒下。除了把对方的镇国特殊科技与独门兵种连锅端进自家资料库外，前线还堆满了等待清点消化的厂房、人力与军火。\n\n这一顿丰盛的战利品，先挑哪一道主菜下肚？"
 FLWAI.38.a:0 "消化工业血肉（新建2座军用工厂、1座民用工厂并获250储备）"
 FLWAI.38.b:0 "吞噬战争精魂（叠1层【吃饱长高高】并补人力、步兵装备与火炮）"
 FLWAI.38.c:0 "饕餮顿悟（领免费验牌券、陆军经验、指挥点数并重置吞噬抽牌冷却）"
 FLWAI.38.c_tt:0 "§G立即获得1张【免费验牌券】，并清除180天吞噬抽牌冷却（下一次吞并敌国可立刻再抽1轮）。§!"
 FLWAI.39.t:0 "【弑神者悬赏】压力怪大魔王倒下了！"
 FLWAI.39.d:0 "在【压力怪的狂欢夜】的高压法则下，一个叠满加成的AI主要大国终究还是被我们正面打垮了。\n\n前线官兵把缴获的军旗送回指挥部，账房也第一时间把最高规格的悬赏金和加抽券送到了桌上。"
 FLWAI.39.a:0 "收下弑神者悬赏并立刻加抽一轮！"
 FLWAI.39.a_tt:0 "§G永久叠加2层《记仇小本本》，获赠1张免费验牌券，并立即加抽1轮词条。§!"
 FLWAI.41.t:0 "地下黑市：半年净收入战备契约"
 FLWAI.41.d_cash:0 "地下黑市的中间人摘下礼帽，把一份烫金契约推过桌面。按我方当前的月度净收入核算，这份持续365天的战备契约要价[?flower_black_market_cost|0]储备。\n\n国库目前现金充裕，可以直接付现签约。请挑选最贴合当下战局的一份契约："
 FLWAI.41.d_loan:0 "地下黑市的中间人眯起眼翻了翻我们的账本：“按你们眼下的月度净收入算，这份365天契约要价[?flower_black_market_cost|0]储备。现钱不够也不要紧，我们替您垫上——差额按1.2倍算，给银行记一笔[?flower_bm_loan_preview|0]的负债就行。”\n\n他把钢笔帽拧开递了过来。要咬牙借这笔高利贷把契约签下来吗？"
 FLWAI.41.a:0 "签下军火急运契约（强化陆军攻击、突破与缴获，立领现货装备）"
 FLWAI.41.b:0 "签下工业加急契约（加快建设与工厂产出，压缩生活消费品需求）"
 FLWAI.41.c:0 "签下图纸情报契约（加快科研、解密与专项计划，送验牌券与突破点）"
 FLWAI.41.d:0 "黑市大客户对赌契约（各占一半：365天全套礼盒或180天军火加现货）"
 FLWAI.41.e:0 "算了，先不花这笔冤枉钱"
 FLWAI.41.pay_tt:0 "现金足够时直接扣除[?flower_black_market_cost|0]储备；现金不足时差额按1.2倍高利贷记入银行负债[?flower_bm_loan_preview|0]。"
 FLWAI.42.t:0 "疯狂科研实验室：实验原型机试装"
 FLWAI.42.d:0 "总工程师抹了把额头上的油灰，让人把刚下测试台的几台实验原型机推进了车库。机器还带着余热，机壳上的焊缝都清晰可见。\n\n经费和产线只够量产其中一套送去前线试装180天，请您拍板挑一台拉出去试试水："
 FLWAI.42.a:0 "试装【轻量化高速履带】（加快行军并减免地形与跨河惩罚，略增油耗）"
 FLWAI.42.b:0 "试装【战地弹药速造车间】（提高工厂产出与炮兵攻击，略增陆军师损耗）"
 FLWAI.42.c:0 "试装【气象观测干预阵】（减免寒热与恶劣天气惩罚，令敌国暴雨90天）"
 FLWAI.42.d_opt:0 "试装【自动化沙盘推演机】（提升计划加成、解密与协同性，送加速卡与突破点）"
 FLWAI.42.e:0 "试装【紧凑型核能动力炉】（加快核反应堆与建设速度，省补给并送核突破点）"
 FLWAI.43.t:0 "最高级警报：魔导国开始咏唱超位魔法！"
 FLWAI.43.d:0 "防空值班室的红灯骤然亮成一片，侦察机和前线观测哨几乎同时发回急电：魔导国上空聚集起骇人的魔力漩涡，一道巨大的超位魔法阵正在高空缓缓成型。\n\n参谋部根据魔力轨迹紧急算出落点——21天后，打击将精准砸向我国的[flower_dvl_target_st_1.GetName]、[flower_dvl_target_st_2.GetName]与[flower_dvl_target_st_3.GetName]。请立即调离危险区域重兵，并在决议栏【流派运营】中准备启动防空结界与紧急疏散。"
 FLWAI.43.a:0 "立刻拉响全国防空警报！（21天倒计时开始）"
 FLWAI.43.a_tt:0 "21天倒计时已在决议栏启动。期间可花费50点指挥点数与50点政治点数开启【启动防空结界与紧急疏散】偏转前两处核心落点。"
 FLWAI.44.t:0 "绝境警报：魔导国濒死启动终末超位魔法！"
 FLWAI.44.d:0 "魔导国前线节节败退之际，观测站突然截获了极其剧烈的魔力波动——对方正在强行启动压箱底的终末仪式，想在覆灭前拉着我们一块垫背。\n\n轨道测算显示，这轮绝唱同样会在21天后落下，锁定的目标是我国的[flower_dvl_target_st_1.GetName]、[flower_dvl_target_st_2.GetName]与[flower_dvl_target_st_3.GetName]。务必抓紧最后三周窗口转移部队并启动防空反制。"
 FLWAI.44.a:0 "狗急跳墙了，全体立刻启动防空反制！"
 FLWAI.44.a_tt:0 "21天倒计时已启动。期间可花费50点指挥点数与50点政治点数在决议栏启动结界，偏转前两处核心打击落点。"

