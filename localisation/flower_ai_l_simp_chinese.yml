 FLWAI.11.d:0 "挑选装甲、空军或人海流派。"
 FLWAI.11.a:0 "时停装甲闪电战"
 FLWAI.11.a_stage1_tt:0 "进入装甲一阶。"
 FLWAI.11.a_stage2_tt:0 "升阶至装甲二阶。"
 FLWAI.11.a_stage3_tt:0 "装甲流派满级。"
 FLWAI.11.b:0 "斯图卡洗头房"
 FLWAI.11.b_stage1_tt:0 "进入空军一阶。"
 FLWAI.11.b_stage2_tt:0 "升阶至空军二阶。"
 FLWAI.11.b_stage3_tt:0 "空军流派满级。"
 FLWAI.11.c:0 "督战队人海"
 FLWAI.11.c_stage1_tt:0 "进入人海一阶。"
 FLWAI.11.c_stage2_tt:0 "升阶至人海二阶。"
 FLWAI.11.c_stage3_tt:0 "人海流派满级。"
 FLWAI.11.e:0 "下一页"
 FLWAI.12.t:0 "流派目录（第3页）"
 FLWAI.12.d:0 "挑选午夜夜战部队、敌后游击战或战地敢死队流派。"
 FLWAI.12.a:0 "午夜夜战部队"
 FLWAI.12.a_stage1_tt:0 "进入夜战一阶，解锁侦察连与通信连。"
 FLWAI.12.a_stage2_tt:0 "升阶至夜战二阶，强化陆战夜战攻击与从战斗获取的情报。"
 FLWAI.12.a_stage3_tt:0 "夜战流派满级，大幅加强夜战火力并培养前线名将。"
 FLWAI.12.b:0 "敌后游击战"
 FLWAI.12.b_stage1_tt:0 "进入游击一阶，强化核心领土攻防与抵抗增长。"
 FLWAI.12.b_stage2_tt:0 "升阶至游击二阶，解锁工兵连与后勤连并提高缴获。"
 FLWAI.12.b_stage3_tt:0 "游击流派满级，战时定期筹集装备并瘫痪敌国后勤。"
 FLWAI.12.c:0 "战地敢死队"
 FLWAI.12.c_stage1_tt:0 "进入敢死队一阶，解锁战地医院并减少有经验士兵损失。"
 FLWAI.12.c_stage2_tt:0 "升阶至敢死队二阶，开启战时定期伤兵与步兵装备回流。"
 FLWAI.12.c_stage3_tt:0 "敢死队流派满级，大幅减免冬季损耗与非战斗补给耗尽惩罚。"
 FLWAI.12.e:0 "下一页"
 FLWAI.13.t:0 "流派目录（第4页）"
 FLWAI.13.d:0 "挑选王牌特种兵团、疯狂科研实验室，或黑市俄罗斯轮盘。"
 FLWAI.13.a:0 "王牌特种兵团"
 FLWAI.13.a_stage1_tt:0 "进入特种一阶，解锁山地步兵、海军陆战队与伞兵。"
 FLWAI.13.a_stage2_tt:0 "升阶至特种二阶，三栖特种全面升级并大幅提高特种容量。"
 FLWAI.13.a_stage3_tt:0 "特种流派满级，解锁三阶特种部队并培养次元撕裂者主帅。"
 FLWAI.13.b:0 "疯狂科研实验室"
 FLWAI.13.b_stage1_tt:0 "进入科研一阶，加速科研与专项计划并获工业电子加速卡。"
 FLWAI.13.b_stage2_tt:0 "升阶至科研二阶，新增科研槽并获陆军科研加速卡。"
 FLWAI.13.b_stage3_tt:0 "科研流派满级，科研速度与军工机构经费全面提高并获多领域突破点。"
 FLWAI.13.c:0 "黑市俄罗斯轮盘"
 FLWAI.13.c_tt:0 "开启黑市大客户特权，首次选择会抱回发光怪蛋并签下半年军令状；每次选择都会立刻转动一次黑市轮盘，并摇一轮持续180天的命运骰子。"
 FLWAI.13.e:0 "翻回第1页"

#核心里程碑与畸变事件（零颜色码）
 FLWAI.21.t:0 "记仇小本本写满啦！"
 FLWAI.21.d:0 "《记仇小本本》整本记满，仓库里全是从对面扒下来的瞄具、钢板和成箱零件。\n\n这批现成的好料子别闲着，是拿去给步兵焊一套重装外骨骼，还是直接铺开前线快修网？"
 FLWAI.21.a:0 "战地外骨骼重装改造"
 FLWAI.21.b:0 "战地万能快修保障网"
 FLWAI.22.t:0 "黑心工厂全线通电！"
 FLWAI.22.d:0 "最后一排新厂房合闸开工，《基建狂魔的流水账》总算攒够了五层。产线跑顺之后电费和原料省下一大截，账上多出不少余钱，科研院也顺势递上了扩编申请。"
 FLWAI.22.a:0 "爽拿奖励！（£hcp_small +500）"
 FLWAI.23.t:0 "后院那颗怪蛋破壳啦！"
 FLWAI.23.d:0 "在后院蹲了整整二百七十天的发光大蛋今早咔嚓裂开，蛋壳里滚出一件宝贝，底下还压着一张抽卡券。\n\n这东西只能定型成一种用法：塞进兵工厂催产能、带上赌桌把霉运甩给对面，还是送去科研院拆图纸？"
 FLWAI.23.a:0 "发条全自动兵工核（按储备补贴攻击与工厂产出，并扩建厂房）"
 FLWAI.23.b:0 "黄金王牌老千军团（把负面骰子甩给交战敌国）"
 FLWAI.23.c:0 "跨时代蓝图秘匣（科研突破与砸钱买兵买装备）"
 FLWAI.24.t:0 "半年军令状交作业啦！"
 FLWAI.24.d:0 "一百八十天期限已到，半年前立下的军令状该算总账了。最新战线图和工厂数目全摆在桌上——达标直接领赏，没达标就老老实实认罚吧。"
 FLWAI.24.a:0 "军令状满分交卷，稳稳拿下！"
 FLWAI.24.b:0 "下次一定，自罚三杯重整旗鼓……"
 FLWAI.25.t:0 "全球交易所新年大行情！"
 FLWAI.25.d:0 "新年钟声刚响，久留美全球交易所就迎来了开年第一波大行情。\n\n趁着这波风口，是花钱把自家军工股拉起来、反手砸盘赌跌赚一笔，干脆去海外买现成兵工厂，还是不折腾直接领分红？"
 FLWAI.25.a:0 "拉高军工大盘（花费200储备）"
 FLWAI.25.b:0 "砸盘赌跌收割（花费250储备）"
 FLWAI.25.c:0 "买断海外兵工厂（花费250储备）"
 FLWAI.25.e:0 "安稳吃分红落袋（获得250储备）"
 FLWAI.26.t:0 "双修大成！觉醒时间到"
 FLWAI.26.d:0 "两条主修流派全都练到了满级，两边的看家本事终于能揉到一块用了。四套终极路数摆在面前，挑一套最顺手的开干吧："
 FLWAI.26.a:0 "移动火药库"
 FLWAI.26.b:0 "钞能力不死军团（£hcp_small +500）"
 FLWAI.26.c:0 "次元霸主"
 FLWAI.26.e:0 "暗夜游击敢死队"
 FLWAI.27.t:0 "将星武道会开打！"
 FLWAI.27.d:0 "新一届将星武道会正式开场，前线能打的将领全到齐了。这一届重点练哪门绝活？"
