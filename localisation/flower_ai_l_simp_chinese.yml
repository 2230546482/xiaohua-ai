#流派主动运营与交互事件
 FLWAI.31.t:0 "【大基建】下达半年生产指标"
 FLWAI.31.d:0 "计划委员会已按当前阶段与工业体量拟定半年指标：接下扩建考核并在180天内达标可赢取履约红利与储备拨款，也可直接开启生产效率冲刺。"
 FLWAI.31.a:0 "军用工厂扩产指标"
 FLWAI.31.a_tt:0 "§G180天到期时，若军用工厂比当前增加至少[?flower_dyn_mil_delta|0]座：§!\n《基建狂魔的流水账》§G+1层§!，获得180天【契约履约红利】与 £hcp_small 储备§G+250§!（未达标扣50政治点数）。"
 FLWAI.31.b:0 "全国工厂扩建指标"
 FLWAI.31.b_tt:0 "§G180天到期时，若全国工厂总数比当前增加至少[?flower_dyn_fac_delta|0]座：§!\n《基建狂魔的流水账》§G+1层§!，获得180天【契约履约红利】与 £hcp_small 储备§G+250§!（未达标扣50政治点数）。"
 FLWAI.31.c:0 "生产效率冲刺（不设考核，立即生效）"
 FLWAI.37.t:0 "【大基建】半年生产指标验收"
 FLWAI.37.d_win:0 "过去半年的工业扩建指标顺利达成，履约红利与储备拨款已全部到位。"
 FLWAI.37.d_fail:0 "半年考核期已满，本轮新增工厂数量未能达到预定指标，计划委员会启动了问责扣减。"
 FLWAI.37.a:0 "达标验收，领取红利"
 FLWAI.37.b:0 "好吧，下轮再接再厉。"
 FLWAI.32.t:0 "【督战队人海】切换战时总动员姿态"
 FLWAI.32.d:0 "总参谋部来问这阶段要摆什么架势——三种动员姿态只能同时开一种：缺人就赶紧扩军，前线吃紧就死守阵地，打累了就轮换回后方歇口气。"
 FLWAI.32.a:0 "疯狂扩军令"
 FLWAI.32.b:0 "寸土不让督战"
 FLWAI.32.c:0 "后方轮战整补"
 FLWAI.32.e:0 "恢复常规战备（解除全部姿态）"
 FLWAI.33.t:0 "【战地敢死队】战地动员方案"
 FLWAI.33.d:0 "前线急救站和后备营都已经就位啦。\n\n这轮优先把轻伤员抢救回前线、抽兵死守阵地，还是让后方车间连夜赶工？"
 FLWAI.33.a:0 "急救伤兵归队"
 FLWAI.33.b:0 "死守钢铁阵地"
 FLWAI.33.c:0 "后方连夜赶工"
 FLWAI.33.e:0 "拼死强攻！"
 FLWAI.34.t:0 "【王牌特种兵团】特种司令部调令"
 FLWAI.34.d:0 "特种司令部送来本周期的整训方案啦。\n\n想稳一点就扩编特种营顺带搞科研，急着破局也能直接下精锐强攻令，立刻抽一批好装备上阵。"
 FLWAI.34.a:0 "特种扩训科研"
 FLWAI.34.b:0 "精锐强攻令"
 FLWAI.34.c:0 "全地形王牌特训"
 FLWAI.35.t:0 "【疯狂科研实验室】实验室专项课题"
 FLWAI.35.d:0 "防护工程组和军工机构代表同时堵在门口啦，两边都嚷着自己的课题最急——这笔经费先批给谁？"
 FLWAI.35.a:0 "全地形隐蔽防护"
 FLWAI.35.b:0 "设计局加班赶工"
 FLWAI.36.t:0 "【黑市轮盘】黑市赌桌筹码操作"
 FLWAI.36.d:0 "黑市老板摇着骰盅正冲你笑呢——这把要花点小钱买份保底保险洗掉晦气，还是趁手热再加倍重摇一发？"
 FLWAI.36.a:0 "购置黑市保底保险"
 FLWAI.36.a_tt:0 "§G保底保险买好啦：下次摇命运骰子100%必出正面状态！§!"
 FLWAI.36.b:0 "加倍再摇一次！"
 FLWAI.36.c:0 "把负面骰子甩给敌国"
 FLWAI.36.c_tt:0 "立刻清掉你身上的负面命运骰子，原封不动转嫁给1个随机交战敌国受罪120天。"
 FLWAI.36.e:0 "花150储备采购机密技术"
 FLWAI.36.e_tt:0 "消耗£hcp_small 储备：§R-150§!"
 FLWAI.25.a_stock_tt:0 "§G【重仓拉升】：全球股市立刻冲进大牛市，【军工防务】当场大涨+25%、【基建重工】上涨+20%！§!"
 FLWAI.25.b_stock_tt:0 "§R【砸盘做空】：全球股市立刻崩盘下挫，【科技飞碟】与【黑市期货】当场暴跌-25%（手里攥着看跌空单就赚翻啦）！§!"
 FLWAI.25.e_stock_tt:0 "§Y【内幕消息】：提前锁定下月风向为【军工防务看涨】，顺便立刻刷新交易所用盈利建厂的冷却！§!"
 FLWAI.38.t:0 "嘎嘣脆，鸡肉味！大胃王进化盛宴！"
 FLWAI.38.d:0 "又一个强敌乖乖倒在我们脚下啦！除了把对面的独门科技和特色兵种全收进资料库，前线还堆着一大批工厂、人力和军火等你点菜呢。\n\n这顿战利品大餐，先挑哪一道下肚？"
 FLWAI.38.a:0 "消化工业血肉"
 FLWAI.38.b:0 "吞噬战争精魂"
 FLWAI.38.c:0 "饕餮顿悟"
 FLWAI.38.c_tt:0 "§G清除180天吞噬抽牌冷却（下回吞并敌国就能立刻再抽1轮）。§!"
 FLWAI.39.t:0 "【弑神者悬赏】压力怪大魔王倒下了！"
 FLWAI.39.d:0 "就算顶着【压力怪的狂欢夜】那一整套逆天加成，这个AI大魔王还是被你正面打趴下啦！不愧是你，这把赢得太漂亮了~\n\n最高规格的弑神悬赏金和加抽券已经送到桌上，快收下吧！"
 FLWAI.39.a:0 "收下弑神者悬赏，顺势再抽一轮！"
 FLWAI.39.a_tt:0 "§G永久叠加2层《记仇小本本》，送1张免费验牌券，并立刻加抽1轮词条。§!"
 FLWAI.41.t:0 "地下黑市：半年净收入战备契约"
 FLWAI.41.d_cash:0 "地下黑市按我国当前净收入与阶段底价开价[?flower_black_market_cost|0]储备，现款充足可直接签约。\n\n签约后180天将验收履约指标：全国工厂总数达[?flower_bm_goal_fac|0]座、控制地区达[?flower_bm_goal_states|0]个，或处于战争状态且陆军经验达[?flower_bm_goal_xp|0]点（满足其一即发红利，未达标受违约惩戒）。"
 FLWAI.41.d_loan:0 "地下黑市开价[?flower_black_market_cost|0]储备，现金不足部分将按1.2倍记入银行借款[?flower_bm_loan_preview|0]。\n\n签约后180天将验收履约指标：全国工厂总数达[?flower_bm_goal_fac|0]座、控制地区达[?flower_bm_goal_states|0]个，或处于战争状态且陆军经验达[?flower_bm_goal_xp|0]点（满足其一即发红利，未达标受违约惩戒）。"
 FLWAI.41.a:0 "签下军火急运契约"
 FLWAI.41.b:0 "签下工业加急契约"
 FLWAI.41.c:0 "签下图纸情报契约"
 FLWAI.41.d:0 "豪赌黑市大客户对赌契约！"
 FLWAI.41.e:0 "算啦，先不签这份契约"
 FLWAI.41.pay_tt:0 "扣除[?flower_black_market_cost|0]储备（现金不足时差额按1.2倍转为银行借款[?flower_bm_loan_preview|0]）。"
 flower_free_reroll_plus_1_tt:0 "免费验牌券：§G+1张§!"
 FLWAI.42.t:0 "疯狂科研实验室：实验原型机试装"
 FLWAI.42.d:0 "几台刚下测试台的新奇原型机正并排停在车库里，机壳上还带着余热呢。\n\n经费和产线只够量产其中一套送去前线试装180天，快拍板挑一台吧："
 FLWAI.42.a:0 "试装【轻量化高速履带】"
 FLWAI.42.b:0 "试装【战地弹药速造车间】"
 FLWAI.42.c:0 "试装【气象观测干预阵】"
 FLWAI.42.d_opt:0 "试装【自动化沙盘推演机】"
 FLWAI.42.e:0 "试装【紧凑型核能动力炉】"
 FLWAI.43.t:0 "最高级警报：魔导国开始咏唱超位魔法！"
 FLWAI.43.d:0 "不好啦！防空值班室的红灯全亮疯了，警报声吵得人头皮发麻——魔导国上空拧出好大一团紫黑魔力漩涡，一道超位魔法阵正在高空缓缓成型！\n\n参谋部紧赶慢赶算出了落点：21天后，这道打击会精准砸向我国的[flower_dvl_target_st_1.GetName]、[flower_dvl_target_st_2.GetName]和[flower_dvl_target_st_3.GetName]。快把危险区里的主力先挪开，顺便去决议栏【流派运营】撑起防空结界保住核心区！"
 FLWAI.43.a:0 "收到，立刻拉响全国防空警报！"
 FLWAI.43.a_tt:0 "21天倒计时已在决议栏启动。期间可在【流派运营】中开启防空结界，稳稳偏转前两处核心落点。"
 FLWAI.44.t:0 "绝境警报：魔导国濒死启动终末超位魔法！"
 FLWAI.44.d:0 "这家伙输急眼啦！前线眼看守不住，观测站突然截获了一股吓人的魔力洪流——魔导国正咬牙强行发动压箱底的终末仪式，想在倒下前拉着我们一块垫背。\n\n轨迹测算出来啦：21天后它同样会砸向我国的[flower_dvl_target_st_1.GetName]、[flower_dvl_target_st_2.GetName]和[flower_dvl_target_st_3.GetName]。别慌，趁这三周赶紧调开重兵并去决议栏撑起防空结界！"
 FLWAI.44.a:0 "狗急跳墙啦，全体立刻防空反制！"
 FLWAI.44.a_tt:0 "21天倒计时已启动。期间可在【流派运营】中启动结界，偏转前两处核心打击落点。"

