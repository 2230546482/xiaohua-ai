#事件
FLWAI.1.t:0 "看得到这段对话吗？"
FLWAI.1.d:0 "“你好！这段对话只有你能看到哦。如果你正在与他人一起进行游戏，请务必告诉他人你看到了此事件！\n\n其实呢，当初起心思做这个子模组，原因也挺简单的。\n每次在萌心原版环境里玩的时候，总觉得各国的对手过于软弱，打起仗来跟在梦游似的，少了些能让人热血沸腾的感觉。所以我给全世界所有国家的AI都彻底换了个脑子。\n主要改动的内容呢，其实主要就是两样：\n一个是AI的战斗逻辑。现在它们懂得了怎么拉防线、怎么做计划、怎么在战场上找机会切断大家的后路，不再像以前那样盲目地冲锋啦。\n另一个就是它们的部队编制！我帮它们把那些各种不合理的弱鸡编制全给撒了，换上了真正带有战斗力的正规编制，省得大家打起来觉得没意思。\n不过呢！在这里一定要和大家郑重交代一件特别重要的事情哦：\n§R【重要提醒】只要开启了这个AI增强子模组，绝对不要跑去《钢铁萌心》主模组的群里或者评论区询问原版环境下的问题呀！§!\n大家想想看，大家开着修改了AI逻辑与环境的子模组，跑去问主模组作者“为什么这个国家打不过，为啥会是这个世界线”或者“为啥有Bug为啥这么牢这么超模”，人家主模组作者可是会超级困扰的！有任何关于这个子模组的疑问，留在本模组反馈就好啦。\n\n好啦，废话就不多说啦。\n祝大家玩得开心哦！”\n\n§R“记住啦！绝对不要去给主模组作者添麻烦！哪怕在加了此模组的情况下截图战况，也最好要告诉别人一下自己加了本模组！”"
FLWAI.1.a:0 "§t我们守不住了……§!"
FLWAI.1.b:0 "§8防线要崩溃了，请尽快送来补给！§!"
FLWAI.1.c:0 "§1敌人的攻势……比预想中要顽强。§!"
FLWAI.1.e:0 "§R……我们回不去了，对吧？§!"
FLWAI.1.f:0 "§7按平时的战术作战吧。§!"

FLWAI.2.t:0 "[FROM.getname]开挂了"
FLWAI.2.d:0 "[FROM.getname]演都不演了。"
FLWAI.2.a:0 "666，你完了，我不举报你我吃石"
FLWAI.2.b:0 "背负古老之力，迎难而上"

