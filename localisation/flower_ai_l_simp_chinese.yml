#肉鸽流派专属主动运营决议、黑市契约与魔导国超位魔法反制
 flower_roguelike_ops_cat:0 "§Y流派运营§!"
 flower_roguelike_ops_cat_desc:0 "这里只放你已选流派对应的专属指令、地下黑市契约，还有魔导国超位魔法应急反制，找起来清爽得很~"
 flower_op_slayer_salvage:0 "【战地扒装备】开启战地回炉车间"
 flower_op_slayer_salvage_desc:0 "满库房都是印着别国铭文的老步枪——与其让它们吃灰，不如统统回炉改铸成前线最缺的炮管和备件啦。"
 flower_op_corp_five_year_plan:0 "【大基建】下达半年生产指标"
 flower_op_corp_five_year_plan_desc:0 "按当前年份与工业体量下达半年生产指标：按期达标可获流水账层数、履约红利与储备拨款，未达标将扣减政治点数。"
 flower_op_arty_barrage:0 "【重炮洗地】炮兵饱和弹幕总攻"
 flower_op_arty_barrage_desc:0 "全线炮兵群取消弹药配额，照着前沿阵地放开轰！"
 flower_op_tank_timestop:0 "【时停装甲】时停穿插"
 flower_op_tank_timestop_desc:0 "全军装甲矛头踩死油门，发起高速穿插突击！"
 flower_op_air_carpet:0 "【斯图卡空军】全空域断后勤洗地"
 flower_op_air_carpet_desc:0 "集中战斗机与密接支援机群，实施全空域火力压制。"
 flower_op_wave_stance:0 "【督战队人海】切换战时总动员姿态"
 flower_op_wave_stance_desc:0 "缺人就赶紧征兵，吃紧就死守阵地，打累了就撤回后方歇口气——三种战时动员姿态随时能换。"
 flower_op_nightingale_raid:0 "【午夜夜战部队】下达子夜奇袭令"
 flower_op_nightingale_raid_desc:0 "今晚全军关灯摸黑干活，这可是夜战部队的拿手好戏。"
 flower_op_guerrilla_sabotage:0 "【敌后游击战】破坏敌后补给线"
 flower_op_guerrilla_sabotage_desc:0 "派遣游击纵队深入敌后，专挑补给动脉下手。"
 flower_op_undead_furnace:0 "【战地敢死队】战地动员方案"
 flower_op_undead_furnace_desc:0 "野战医院、战壕工事还是后方车间？快挑挑这批预备队眼下最该顶去哪儿吧。"
 flower_op_magic_rift:0 "【王牌特种兵团】特种司令部调令"
 flower_op_magic_rift_desc:0 "特种司令部正等着你的命令呢：慢慢练兵顺带搞科研，还是直接放精锐上阵破局？"
 flower_op_punk_expedition:0 "【疯狂科研】实验室专项课题"
 flower_op_punk_expedition_desc:0 "实验室预算刚好够立一个大项目，快拍板挑本周期的研究方向吧。"
 flower_op_gambler_chips:0 "【黑市轮盘】黑市赌桌筹码操作"
 flower_op_gambler_chips_desc:0 "在地下赌桌购置保底保险、重摇命运骰子，或动用蛋壳秘宝的专属手段。"
 flower_op_black_market_contract:0 "【黑市契约】花费半年净收入购买战备强化"
 flower_op_black_market_contract_desc:0 "地下中间人正拿着新一季货单候在门外，修习黑市轮盘或持有贵宾折扣券均可享受额外优惠。"
 flower_op_black_market_contract_tt:0 "打开黑市契约面板（报价§Y[?flower_black_market_cost|0]§!储备；现金不足时差额按1.2倍转为银行借款§R[?flower_bm_loan_preview|0]§!）。"
 flower_dvl_super_magic_warning_mission:0 "§R【超位魔法预警】魔导国正在咏唱超位魔法！§!"
 flower_dvl_super_magic_warning_mission_desc:0 "不好啦！魔导国首都上空拧出好大一团紫黑魔力漩涡，正死死盯着我国三处战略目标！赶紧把危险区的重兵挪走，并在下方开启防空结界偏转前两处核心落点！"
 flower_dvl_magic_counter_dec:0 "【紧急反制】启动防空结界与紧急疏散"
 flower_dvl_magic_counter_dec_desc:0 "魔导国的超位魔法法阵已经在天顶亮起，趁咏唱还没落音，赶紧撑起防空结界疏散重点厂区！"
 flower_dvl_magic_counter_dec_tt:0 "§G防空结界撑起来啦！§!倒计时结束时将偏转前两处核心落点，仅第三处外围受损，并激活90天【超位魔法结界反制抢修】。"
 flower_op_arty_demolish_tt:0 "§O【大炮洗地拆迁办】§!：同时轰毁交战主要敌国前线的铁路、补给中心、基础设施与防空阵地。"
 flower_op_tank_timestop_enemy_tt:0 "§C【The World！】§!：令随机交战敌军陷入30天【阵脚遭闪电穿插打乱】。"
 flower_op_air_crush_enemy_tt:0 "§t【斯图卡在线洗头】§!：同时轰炸随机交战敌国前线空军基地与防空阵地，并使其承受45天【制空权遭全面压制】。"
 flower_op_night_blind_steal_tt:0 "§1【半夜硬控突袭】§!：令随机交战敌国承受60天【战区电台遭夜战破译】，并截获1张科研加速卡。"
 flower_op_guerrilla_scorch_tt:0 "§G【坚壁清野】§!：同时炸毁敌军占领的全部我国核心地区铁路与基础设施，并拉升25%抵抗度。"

