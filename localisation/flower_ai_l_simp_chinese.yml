#核心里程碑与畸变事件
 FLWAI.21.t:0 "记仇小本本写满啦！"
 FLWAI.21.d:0 "《记仇小本本》总算翻到最后一页啦！库房里堆得满满当当，全是从各条战线缴获回来的光学瞄具、装甲钢板和精密扳手——连对面司令部的备用发电机都被编上号了。\n\n这批好料放着多浪费呀：拿去给步兵装一套重装外骨骼，还是把全军野战维修网彻底铺开？"
 FLWAI.21.a:0 "战地外骨骼重装改造"
 FLWAI.21.b:0 "战地万能快修保障网"
 FLWAI.22.t:0 "黑心工厂全线通电！"
 FLWAI.22.d:0 "最后一排新厂房合闸开工，《基建狂魔的流水账》整整攒够五页啦！产线跑顺之后，电费和原料账单薄了一大截；听说国库冒出这么多余钱，科研院那帮人动作可真快，扩编申请书已经拍在桌上咯。"
 FLWAI.22.a:0 "收下工业红利"
 FLWAI.23.t:0 "后院那颗怪蛋破壳啦！"
 FLWAI.23.d:0 "在后院亮了整整二百七十天的大蛋，今早终于咔嚓裂开啦！碎蛋壳里滚出一件热乎乎的奇物，底下还偷偷压着一张崭新的抽卡券。\n\n这宝贝只能定型成一种用法，可得挑仔细点：送进兵工厂催产能、带上赌桌把霉运转嫁给敌国，还是交给科研院拆图纸？"
 FLWAI.23.a:0 "发条全自动兵工核"
 FLWAI.23.b:0 "黄金王牌老千军团"
 FLWAI.23.c:0 "跨时代蓝图秘匣"
 FLWAI.24.t:0 "半年军令状交作业啦！"
 FLWAI.24.d:0 "一百八十天期限已到，半年前立下的军令状迎来验收（需全国工厂总数达[?flower_wager_goal_factories|0]座，或控制地区总数达[?flower_wager_goal_states|0]个）。"
 FLWAI.24.a:0 "军令状满分交卷，稳稳拿下！"
 FLWAI.24.b:0 "未能达标，接受违约惩戒"
 FLWAI.25.t:0 "全球交易所行情风暴！"
 FLWAI.25.d:0 "新年开市钟声刚落，久留美全球交易所的报价牌就噼里啪啦跳个不停，热闹得不行！\n\n眼下风口正好，要重仓拉升自家军工股、联手砸盘做空大盘，干脆拿支票买断海外兵工厂，还是安安稳稳收一笔分红落袋？"
 FLWAI.25.a:0 "重仓拉升自家军工股"
 FLWAI.25.b:0 "联手砸盘做空大盘"
 FLWAI.25.c:0 "买断海外兵工厂"
 FLWAI.25.e:0 "稳稳吃分红落袋"
 FLWAI.26.t:0 "双修大成！觉醒时间到"
 FLWAI.26.d:0 "两条主修流派全都练满级啦！原本各打各的体系现在彻底揉成一块，这仗总算不用再按老黄历慢慢磨了。\n\n四套终极战法都在这儿，快挑一套最合心意的当本局王牌吧："
 FLWAI.26.a:0 "移动火药库"
 FLWAI.26.b:0 "钞能力不死军团"
 FLWAI.26.c:0 "次元霸主"
 FLWAI.26.e:0 "暗夜游击敢死队"
 FLWAI.27.t:0 "将星武道会开打！"
 FLWAI.27.d:0 "新一届将星武道会准时开场，各集团军主官全到演武场报到啦，谁都想趁这回集训把自己的绝活再磨亮几分。\n\n这一届重点练哪一门绝技？"
 FLWAI.27.a:0 "修习【万人敌】"
 FLWAI.27.b:0 "修习【空间魔术师】"
 FLWAI.27.c:0 "修习【大兵团棋手】"
 FLWAI.27.e:0 "修习【天选总座（微操之神）】"
 FLWAI.28.t:0 "对面的阵线被我们碾过去啦！"
 FLWAI.28.d:0 "先头部队发来捷报啦：对面主力已经溃不成军，一路上丢满了成排卡车、满桶燃油和完好的野战跑道。这批现成战利品怎么分？"
 FLWAI.28.a:0 "全军加速突进，一鼓作气！"
 FLWAI.28.b:0 "缴获全套卡车，补满全军油箱"
 FLWAI.28.c:0 "空地协同推进，扩建前线空军基地"

