 FLWAI.29.c_tt:0 "花费£hcp_small 储备§R-150§!，立刻清除当前负面状态并重新摇一次命运骰子。"
 flower_gambler_roll_desc_1:0 "【欧皇附体！】\n哇，金色传说！\n\n持续180天：\n£attack_texticon 陆军师攻击+10%   £defence_texticon 陆军师防御+10%\n£breakthrough_texticon 突破+15%   £cn_attacker_speed_texticon 陆军师速度+15%\n£planning_speed_texticon 计划速度+50%   £political_power_texticon 另领政治点数+50"
 flower_gambler_roll_desc_2:0 "【天降横财！】\n黑市老板居然良心发现多发了一车原料，厂长笑得嘴都合不拢了。\n\n持续180天：\n£civ_factory_output 工厂产出+25%   £construction_speed_texticon 建设速度+25%\n£consumer_goods_texticon 生活消费品工厂系数-15%   £trade_texticon 收入修正+50%\n£hcp_small 另入账储备+300"
 flower_gambler_roll_desc_3:0 "【灵光一闪，手搓奇迹！】\n科研院喝完浓茶突然顿悟，图纸画得飞起！\n\n持续180天：\n£research_speed_texticon 科研速度+30%   £special_project_texticon 专项计划速度+75%\n£army_experience 陆军经验增长+50%   £command_power_texticon 每日指挥点数增长乘数+50%\n£army_experience 另领陆军经验+50   £air_experience 空军经验+50"
 flower_gambler_roll_desc_4:0 "【命硬如铁，子弹拐弯！】\n也不知道哪路神仙在保佑，炮弹落下来愣是擦着钢盔边飞过去了。\n\n持续180天：\n£organization_texticon 陆军师组织度+20%   £organization_gain_texticon 陆军师组织度恢复速率+30%\n£supply_consumption_texticon 补给消耗-25%   £attrition_texticon 陆军师损耗-35%\n£manpower_texticon 每周人力+4000"
 flower_gambler_roll_desc_5:0 "【手气发黑，债主上门！】\n杠杆加太猛爆仓了，财务处正连夜把厂里的铜线拆下来抵债……\n\n持续180天：\n£consumer_goods_texticon 生活消费品工厂系数+10%   £civ_factory_output 工厂产出-10%\n£construction_speed_texticon 建设速度-10%   £trade_texticon 收入修正-20%"
 flower_gambler_roll_desc_6:0 "【买到假货，枪管炸膛！】\n黑市老板卖的这批子弹一半是哑弹，前线士兵气得想把枪摔他脸上。\n\n持续180天：\n£attack_texticon 陆军师攻击-10%   £breakthrough_texticon 突破-10%\n£attrition_texticon 陆军师损耗+15%   £supply_consumption_texticon 补给消耗+10%"
 flower_gambler_roll_desc_7:0 "【参谋喝假酒，地图拿反了！】\n前线发来急电：司令部下达的穿插路线画到自家后院去了！\n\n持续180天：\n£organization_texticon 陆军师组织度-10%   £planning_speed_texticon 计划速度-25%\n£cn_attacker_speed_texticon 陆军师速度-10%   £org_loss_when_moving_texticon 移动中组织度损失+15%"
 flower_gambler_roll_desc_8:0 "【黑料曝光，全线吃瓜！】\n报纸头版全在扒黑市交易的内幕，科研院和内阁全跑去吃瓜摸鱼了。\n\n持续180天：\n£stability_texticon 稳定度-10%   £war_support_modifiericons_texticon 战争支持度-10%\n£research_speed_texticon 科研速度-10%   £political_power_texticon 政治点数-15%"

