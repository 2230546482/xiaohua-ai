 flower_arty_stage_3_idea_desc:0 "二营长！你他娘的意大利炮呢？"
 flower_tank_stage_1_idea:0 "§C把拖拉机焊上钢板就能冲（装甲一阶）§!"
 flower_tank_stage_1_idea_desc:0 "拖拉机焊两块钢板，也敢叫主战坦克！"
 flower_tank_stage_2_idea:0 "§C钢铁洪流高速突击（装甲二阶）§!"
 flower_tank_stage_2_idea_desc:0 "油门踩进油箱里，直接穿插包饺子！"
 flower_tank_stage_3_idea:0 "§R时停穿插包饺子大师（装甲满级）§!"
 flower_tank_stage_3_idea_desc:0 "别看正面防线了，先看看你们首都谁在占点吧。"
 flower_corp_stage_1_idea:0 "§C三班倒流水线，机器不准停（大基建一阶）§!"
 flower_corp_stage_1_idea_desc:0 "只要干不死，就往死里干！"
 flower_corp_stage_2_idea:0 "§C全自动黑心工厂与资源内循环（大基建二阶）§!"
 flower_corp_stage_2_idea_desc:0 "你不干，有的是帕鲁干！"
 flower_corp_stage_3_idea:0 "§G基建狂魔工业帝国（大基建满级）§!"
 flower_corp_stage_3_idea_desc:0 "工业基础，产能就不基础！"
 flower_air_stage_1_idea:0 "§t铝皮飞机论斤卖（空军一阶）§!"
 flower_air_stage_1_idea_desc:0 "只要天上是绿的，地上拴条狗都能推！"
 flower_air_stage_2_idea:0 "§t斯图卡尖啸：全天候洗地（空军二阶）§!"
 flower_air_stage_2_idea_desc:0 "抬头看天，全是俯冲下来的斯图卡！"
 flower_air_stage_3_idea:0 "§C遮天蔽日空降斩首（空军满级）§!"
 flower_air_stage_3_idea_desc:0 "炸平机场，伞降首都，一气呵成！"
 flower_wave_stage_1_idea:0 "§O连炊事班大爷都发把枪（人海一阶）§!"
 flower_wave_stage_1_idea_desc:0 "连炊事班大爷都领上步枪了！"
 flower_wave_stage_2_idea:0 "§O督战队架起机枪（人海二阶）§!"
 flower_wave_stage_2_idea_desc:0 "一步也不许后退！"
 flower_wave_stage_3_idea:0 "§R铁血反包围钢铁人墙（人海满级）§!"
 flower_wave_stage_3_idea_desc:0 "我们的人比他们的子弹还多！"
 flower_magic_stage_1_idea:0 "§1皇家特战集训营（特种一阶）§!"
 flower_magic_stage_1_idea_desc:0 "曼波，曼波，欧嘛吉里曼波~"
 flower_magic_stage_2_idea:0 "§1三栖全能破点尖刀（特种二阶）§!"
 flower_magic_stage_2_idea_desc:0 "一个师顶对面一个集团军，这合理吗？"
 flower_magic_stage_3_idea:0 "§R王牌特种精锐兵团（特种满级）§!"
 flower_magic_stage_3_idea_desc:0 "不是哥们，你这特种兵怎么飞天遁地啥都会？"
 flower_nightingale_stage_1_idea:0 "§1夜幕侦察渗透（夜战一阶）§!"
 flower_nightingale_stage_1_idea_desc:0 "天黑请闭眼。"
 flower_nightingale_stage_2_idea:0 "§1破译电台夜间突袭（夜战二阶）§!"
 flower_nightingale_stage_2_idea_desc:0 "大晚上不睡觉，搁对面阵地里团建呢？"
 flower_nightingale_stage_3_idea:0 "§R暗夜刺客总攻（夜战满级）§!"
 flower_nightingale_stage_3_idea_desc:0 "这把全员通宵夜战，睡不了一点！"
 flower_guerrilla_stage_1_idea:0 "§G山林里点把火（游击一阶）§!"
 flower_guerrilla_stage_1_idea_desc:0 "敌进我退，敌驻我扰，敌疲我打，敌退我追！"
 flower_guerrilla_stage_2_idea:0 "§G地雷战与地道战（游击二阶）§!"
 flower_guerrilla_stage_2_idea_desc:0 "地雷战，地道战，不见鬼子不挂弦！"
 flower_guerrilla_stage_3_idea:0 "§R人民战争的汪洋大海（游击满级）§!"
 flower_guerrilla_stage_3_idea_desc:0 "没有枪，没有炮，敌人给我们造！\n战时每3个月自动筹集装备并瘫痪敌国后勤60天。"
 flower_undead_stage_1_idea:0 "§R战地急救敢死队（敢死队一阶）§!"
 flower_undead_stage_1_idea_desc:0 "轻伤不下火线，裹上绷带接着上！"
 flower_undead_stage_2_idea:0 "§R越战越勇伤兵归队（敢死队二阶）§!"
 flower_undead_stage_2_idea_desc:0 "军医！打一针肾上腺素，我还能冲！\n战时每3个月自动回流伤兵人力与步兵装备。"
 flower_undead_stage_3_idea:0 "§R死战不退不灭兵团（敢死队满级）§!"
 flower_undead_stage_3_idea_desc:0 "只要战地医院还在，人就永远打不光！"
 flower_steampunk_stage_1_idea:0 "§C前沿科研立项室（科研一阶）§!"
 flower_steampunk_stage_1_idea_desc:0 "不是哥们，这图纸真是1936年画出来的？"
 flower_steampunk_stage_2_idea:0 "§C军工机构加急车间（科研二阶）§!"
 flower_steampunk_stage_2_idea_desc:0 "怎么个事？别人还在拉大栓，咱这都快手搓黑科技了！"
 flower_steampunk_stage_3_idea:0 "§t跨时代科研技术领先（科研满级）§!"
 flower_steampunk_stage_3_idea_desc:0 "给我干哪来了，这还是二战吗？"
 flower_synergy_iron_rain_idea:0 "§R移动火药库（双修大成）§!"
 flower_synergy_iron_rain_idea_desc:0 "我们只需在门上踢一脚，整栋腐朽的建筑都会坍塌！"
 flower_synergy_immortal_tycoon_idea:0 "§Y钞能力不死军团（双修大成）§!"
 flower_synergy_immortal_tycoon_idea_desc:0 "钱多得花不完，兵也多得打不完。"
 flower_synergy_void_overlord_idea:0 "§1次元霸主（双修大成）§!"
 flower_synergy_void_overlord_idea_desc:0 "这下真成异世界大战了，原来的剧本早就撕没了。"
 flower_synergy_nightmare_guerrilla_idea:0 "§1暗夜游击敢死队（双修大成）§!"
 flower_synergy_nightmare_guerrilla_idea_desc:0 "夜战、游击、敢死队三家凑成一桌斗地主，对面守军直接破防！"
 flower_mystery_egg_incubating_idea:0 "§1后院挖出来的发光怪蛋（孵化中……）§!"
 flower_mystery_egg_incubating_idea_desc:0 "后院挖出来的发光大蛋，总觉得蹲够270天会孵出什么了不得的东西。"
 flower_mystery_egg_hatched_idea:0 "§G破壳而出的黄金宝藏§!"
 flower_mystery_egg_hatched_idea_desc:0 "蹲了大半年居然真孵出个惊天大奖，快哉快哉！"
 flower_blood_wager_active_idea:0 "§R带血的半年军令状（考核中）§!"
 flower_blood_wager_active_idea_desc:0 "180天内多控制2个地区或新增10座工厂即达标领奖，完不成自罚三杯。"
 flower_blood_wager_victory_idea:0 "§G超额完成军令状§!"
 flower_blood_wager_victory_idea_desc:0 "半年军令状满分交卷，稳稳拿下！"
 flower_blood_wager_consolation_idea:0 "§7知耻而后勇（下次一定）§!"
 flower_blood_wager_consolation_idea_desc:0 "这次没交上作业，下次一定！"
 flower_tycoon_bull_market_idea:0 "§G满仓做多军工大盘§!"
 flower_tycoon_bull_market_idea_desc:0 "大盘红彤彤一片，自家股票连拉涨停板！"
 flower_tycoon_short_squeezed_idea:0 "§R遭遇恶意做空§!"
 flower_tycoon_short_squeezed_idea_desc:0 "鼠鼠我啊，这次是真滴寄咯！"
 flower_blitz_speed_king_idea:0 "§O闪电急先锋§!"
 flower_blitz_speed_king_idea_desc:0 "装甲师冲得太快，后勤卡车在屁股后面追都追不上。"
 flower_roulette_anti_scam_idea:0 "§C防骗指南（吃一堑长一智）§!"
 flower_roulette_anti_scam_idea_desc:0 "被黑市老板坑过一次后长了记性，下次转动黑市俄罗斯轮盘100%必中头奖。"
 flower_nightmare_final_boss_idea:0 "§R终局大魔王二阶段§!"
 flower_nightmare_final_boss_idea_desc:0 "“最近混得挺不错啊，是不是连我都敢惹了？”"
 flower_hero_stage_1_idea:0 "名将特训讲武堂（将星一阶）"
 flower_hero_stage_1_idea_desc:0 "§L把前线最能打的狠人全部拉进特训班，手把手打磨指挥本事。§!"
 flower_hero_stage_2_idea:0 "嘉豪军工赞助财团（将星二阶）"
 flower_hero_stage_2_idea_desc:0 "§L总座亲自出面拉来赞助，军工机构经费和财政账本都宽裕了不少。§!"
 flower_hero_stage_3_idea:0 "神仙将星总参谋部（将星满级）"
 flower_hero_stage_3_idea_desc:0 "§L满屋子名将坐镇参谋部，打仗和管厂子都顺手得多。§!"
 flower_slayer_exo_armor_idea:0 "§R战地外骨骼重装改造§!"
 flower_slayer_exo_armor_idea_desc:0 "把战场上拆回来的厚重装甲板与液压件全焊上步兵装备，硬顶着炮火往前推。"
 flower_slayer_field_repair_idea:0 "§C战地万能快修保障网§!"
 flower_slayer_field_repair_idea_desc:0 "前线维修班拿一把扳手就能把缴获来的破铜烂铁修得比原厂还好用。"
 flower_egg_clockwork_forge_idea:0 "§Y蛋壳秘宝：发条全自动兵工核§!"
 flower_egg_clockwork_forge_idea_desc:0 "从发光怪蛋里滚出来的精密发条核心，装进厂房后机器转得飞快。"
 flower_egg_golden_vanguard_idea:0 "§1蛋壳秘宝：黄金王牌老千军团§!"
 flower_egg_golden_vanguard_idea_desc:0 "蛋壳里藏着整套老千秘籍与精锐操典，坏运气随时都能甩给交战敌国。"
 flower_egg_arcane_blueprint_idea:0 "§C蛋壳秘宝：跨时代蓝图秘匣§!"
 flower_egg_arcane_blueprint_idea_desc:0 "装满超前图纸的神秘金属匣，科研院和军工机构如获至宝。"

#肉鸽流派目录事件（AI后台路径备用文案，无颜色码）
 FLWAI.10.t:0 "流派目录（第1页）"
 FLWAI.10.d:0 "挑选一条核心流派主线或升阶现有流派。"
 FLWAI.10.a:0 "战地扒装备"
 FLWAI.10.a_tt:0 "《记仇小本本》层数+2。"
 FLWAI.10.b:0 "大基建五年计划"
 FLWAI.10.b_tt:0 "《基建狂魔的流水账》层数+2，£hcp_small 储备+100。"
 FLWAI.10.c:0 "重炮洗地俱乐部"
 FLWAI.10.c_stage1_tt:0 "进入重炮一阶。"
 FLWAI.10.c_stage2_tt:0 "升阶至重炮二阶。"
 FLWAI.10.c_stage3_tt:0 "重炮流派满级：解锁三级火炮、改进型火箭炮与自行火箭炮，并增派列车炮。"
 FLWAI.10.e:0 "下一页"
