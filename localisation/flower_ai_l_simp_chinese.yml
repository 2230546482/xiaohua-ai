#肉鸽流派专属主动运营决议、黑市契约与魔导国超位魔法反制
 flower_roguelike_ops_cat:0 "§Y流派运营§!"
 flower_roguelike_ops_cat_desc:0 "这里仅显示你已选流派对应的主动运营指令、黑市半年净收入契约以及超位魔法预警反制。"
 flower_op_slayer_salvage:0 "【战地扒装备】开启战地回炉车间"
 flower_op_slayer_salvage_desc:0 "消耗25点政治点数并将仓库中3000步兵装备回炉拆解，立即获得牵引式火炮§G+550§!、支援装备§G+350§!、燃油§G+30000§!、陆军经验§G+40§!，以及《记仇小本本》§G+1层§!（冷却150天）。"
 flower_op_corp_five_year_plan:0 "【大基建】下达半年生产指标"
 flower_op_corp_five_year_plan_desc:0 "消耗25点政治点数，从军用工厂扩产、民用工业建设与生产效率冲刺三项指标中任选其一：期间获得对应工业加成，180天到期达标后额外获得新建工厂与《基建狂魔的流水账》层数（冷却180天）。"
 flower_op_arty_barrage:0 "【重炮洗地】炮兵饱和弹幕总攻"
 flower_op_arty_barrage_desc:0 "战时消耗500牵引式火炮与25点指挥点数，开启90天【饱和弹幕总攻】（冷却150天；选定对应进阶分支后还会附带额外破坏战果）。"
 flower_op_tank_timestop:0 "【时停装甲】按下银怀表：时停穿插"
 flower_op_tank_timestop_desc:0 "战时消耗35点指挥点数与20点政治点数，补充100000燃油并开启60天【银怀表：时停穿插】（冷却180天；选定对应进阶分支后还会附带额外战果）。"
 flower_op_air_carpet:0 "【斯图卡空军】全空域护航与断后勤洗地"
 flower_op_air_carpet_desc:0 "战时消耗30点空军经验与25点指挥点数，在首都扩建2级空军基地并开启90天【全空域断后勤洗地】（冷却150天；选定对应进阶分支后还会附带额外空袭战果）。"
 flower_op_wave_stance:0 "【督战队人海】切换战时总动员姿态"
 flower_op_wave_stance_desc:0 "消耗20点政治点数，随时在三种战时动员姿态间切换，同一时间仅生效一种（冷却120天）。"
 flower_op_nightingale_raid:0 "【午夜夜战部队】下达子夜奇袭令"
 flower_op_nightingale_raid_desc:0 "战时消耗30点指挥点数与20点陆军经验，开启90天【子夜奇袭突击】并入库2000步兵装备与300支援装备（冷却150天；选定对应进阶分支后还会附带额外情报战果）。"
 flower_op_guerrilla_sabotage:0 "【敌后游击战】破坏敌后补给线"
 flower_op_guerrilla_sabotage_desc:0 "战时消耗25点政治点数与1500步兵装备瘫痪敌国后勤90天，并缴获300牵引式火炮、250支援装备与35点陆军经验（冷却150天；选定对应进阶分支后还会附带额外破交战果）。"
 flower_op_undead_furnace:0 "【战地敢死队】战地动员方案"
 flower_op_undead_furnace_desc:0 "消耗25点政治点数，根据前线战况选定一项战地动员方案（冷却150天；部分进阶分支还会解锁专属指令）。"
 flower_op_magic_rift:0 "【王牌特种兵团】特种司令部调令"
 flower_op_magic_rift_desc:0 "消耗25点政治点数，下达本周期的特种部队整训或强攻调令（冷却150天；部分进阶分支还会解锁专属特训）。"
 flower_op_punk_expedition:0 "【疯狂科研】实验室专项课题"
 flower_op_punk_expedition_desc:0 "消耗25点政治点数，为实验室批复本周期的专项研究方向（冷却150天；选定特定进阶分支后还将直接开启实验原型试装）。"
 flower_op_gambler_chips:0 "【黑市轮盘】黑市赌桌筹码操作"
 flower_op_gambler_chips_desc:0 "花费100储备（不足改耗40点政治点数），在黑市赌桌加注、买保险或动用已解锁的秘宝门道（冷却150天）。"
 flower_op_black_market_contract:0 "【黑市契约】花费半年净收入购买战备强化"
 flower_op_black_market_contract_desc:0 "向地下黑市支付相当于我国当前6个月净收入的资金（当前估算约§Y[?flower_black_market_cost|0]§!储备；选了【黑市俄罗斯轮盘】可享8折优惠），换取持续365天的军火、工业或情报契约。§Y若现有现金不足，允许将差额按1.2倍高利贷记入银行负债直接签约。§!（冷却365天）"
 flower_op_black_market_contract_tt:0 "打开黑市半年净收入契约面板：按当前6个月净收入（约§Y[?flower_black_market_cost|0]§!储备）挑选一份持续365天的契约；现金不足时差额按1.2倍记入银行负债（约§R[?flower_bm_loan_preview|0]§!）。"
 flower_dvl_super_magic_warning_mission:0 "§R【超位魔法预警】魔导国正在咏唱超位魔法！§!"
 flower_dvl_super_magic_warning_mission_desc:0 "情报部门监测到魔导国首都上空聚集起骇人的魔力漩涡，预计21天后将在锁定的三处战略地区落下超位魔法。请立即调离危险地区重兵，或点击下方【启动防空结界与紧急疏散】偏转前两处核心落点。"
 flower_dvl_magic_counter_dec:0 "【紧急反制】启动防空结界与紧急疏散"
 flower_dvl_magic_counter_dec_desc:0 "在魔导国21天咏唱倒计时结束前，消耗50点指挥点数与50点政治点数展开防空结界并疏散核心工业区。§G启动后将完全偏转前两处核心落点，仅第三处外围地区受损，并获得90天全国抢修加成。§!"
 flower_dvl_magic_counter_dec_tt:0 "§G已展开防空结界与紧急疏散！§!21天倒计时结束时将偏转前两处核心地区的超位魔法打击，并激活90天【超位魔法结界反制与抢修】。"
 flower_op_arty_demolish_tt:0 "§O【大炮洗地拆迁办效果】§!：直接轰毁交战主要敌国前线的陆上要塞、铁路、基础设施与补给中心。"
 flower_op_tank_timestop_enemy_tt:0 "§C【The World！效果】§!：使随机交战敌国防线陷入30天【防线遭闪电穿插瘫痪】。"
 flower_op_air_crush_enemy_tt:0 "§t【斯图卡在线洗头效果】§!：直接炸毁随机交战敌国前线空军基地与防空阵地，并使其承受45天【制空权遭全面压制】。"
 flower_op_night_blind_steal_tt:0 "§1【半夜硬控突袭效果】§!：使随机交战敌国承受60天【战区电台遭夜战破译】，并窃取1张科研加速卡。"
 flower_op_guerrilla_scorch_tt:0 "§G【坚壁清野效果】§!：直接炸毁敌军占领的全部我国核心地区铁路与基础设施，拉升25%抵抗度。"

#主动运营限时精神、黑市契约精神、敌国减益与实验室原型机精神
 flower_op_corp_mil_plan_idea:0 "§O半年军用工厂扩产指标§!"
 flower_op_corp_mil_plan_idea_desc:0 "全厂加紧赶工扩建军用工厂，180天内新增3座军用工厂即可达标领奖。"
 flower_op_corp_civ_plan_idea:0 "§C半年民用工业建设指标§!"
 flower_op_corp_civ_plan_idea_desc:0 "集中力量推进民用工业建设，180天内全国工厂总数新增4座即可达标领奖。"
 flower_op_corp_eff_plan_idea:0 "§G半年生产效率冲刺§!"
 flower_op_corp_eff_plan_idea_desc:0 "理顺车间工序，稳步提高生产效率增长与生产效率上限。"
 flower_op_arty_barrage_idea:0 "§R饱和弹幕总攻§!"
 flower_op_arty_barrage_idea_desc:0 "全线炮兵群全速开火，把正面工事砸成碎砖。"
 flower_op_tank_timestop_idea:0 "§C银怀表：时停穿插§!"
 flower_op_tank_timestop_idea_desc:0 "装甲集群踩满油门高速穿插，趁对手还没反应过来把口袋扎死。"
 flower_op_air_carpet_idea:0 "§t全空域断后勤洗地§!"
 flower_op_air_carpet_idea_desc:0 "战斗机与俯冲轰炸机轮番出击，把前线公路炸成焦土。"
 flower_op_wave_expand_idea:0 "§O总动员姿态：疯狂扩军令§!"
 flower_op_wave_expand_idea_desc:0 "扩大征兵并压缩陆军师训练时间，把新兵迅速补上前线。"
 flower_op_wave_hold_idea:0 "§R总动员姿态：寸土不让督战§!"
 flower_op_wave_hold_idea_desc:0 "依托纵深防线死守本土，寸土不让。"
 flower_op_wave_rest_idea:0 "§G总动员姿态：后方轮战整补§!"
 flower_op_wave_rest_idea_desc:0 "把疲惫部队轮换到后方休整，补齐组织度并节省补给。"
 flower_op_nightingale_raid_idea:0 "§1子夜奇袭突击§!"
 flower_op_nightingale_raid_idea_desc:0 "借着夜色发起渗透突袭，让敌方侦察和空军都摸不着头脑。"
 flower_op_guerrilla_sabotaged_idea:0 "§R深陷敌后游击破坏§!"
 flower_op_guerrilla_sabotaged_idea_desc:0 "后方铁路与补给线接连被游击队炸断，前线部队行军迟缓、补给吃紧。"
 flower_op_undead_surge_idea:0 "§R敢死队姿态：急救伤兵归队§!"
 flower_op_undead_surge_idea_desc:0 "前线救护车与野战医院连轴运转，轻伤员包扎完立刻重返阵地。"
 flower_op_undead_armor_idea:0 "§1敢死队姿态：死守钢铁防线§!"
 flower_op_undead_armor_idea_desc:0 "全军咬牙死守战壕，寸步不退。"
 flower_op_undead_labor_idea:0 "§Y敢死队姿态：后方连夜赶工§!"
 flower_op_undead_labor_idea_desc:0 "后方工厂昼夜不停工，全力保障前线弹药和基建。"
 flower_op_undead_overdrive_idea:0 "§R敢死队拼死强攻§!"
 flower_op_undead_overdrive_idea_desc:0 "不计代价投入预备队发起60天舍命强攻。"
 flower_op_magic_steady_idea:0 "§C特种调令：特种扩训与科研§!"
 flower_op_magic_steady_idea_desc:0 "一边扩训特种部队，一边把实战经验送回科研院立项。"
 flower_op_magic_overload_idea:0 "§R特种调令：精锐强攻§!"
 flower_op_magic_overload_idea_desc:0 "精锐尖刀全线出击，用短期内耗换取前线破阵。"
 flower_op_punk_forest_idea:0 "§G实验室课题：全地形隐蔽防护§!"
 flower_op_punk_forest_idea_desc:0 "全面配发伪装网与防空掩体套件，减小空袭与恶劣环境的伤亡。"
 flower_op_punk_ufo_idea:0 "§t实验室课题：设计局加班赶工§!"
 flower_op_punk_ufo_idea_desc:0 "科研院与军工机构一起加班赶工，加快新装备定型与战机改进。"
 flower_bm_arms_supply_idea:0 "§R黑市军火急运契约§!"
 flower_bm_arms_supply_idea_desc:0 "花掉半年净收入从黑市紧急调运一批精良军火与备件，充实前线补给。"
 flower_bm_industry_boost_idea:0 "§Y黑市工业加急契约§!"
 flower_bm_industry_boost_idea_desc:0 "重金从黑市采购稀缺机床与原料，让各条产线全速运转起来。"
 flower_bm_intel_tech_idea:0 "§C黑市图纸情报契约§!"
 flower_bm_intel_tech_idea_desc:0 "花重金买下海外情报网与实验室图纸，为科研院省下大把摸索时间。"
 flower_bm_vip_jackpot_idea:0 "§1黑市大客户对赌契约§!"
 flower_bm_vip_jackpot_idea_desc:0 "黑市老板亲自端上桌的头等大礼，从前线枪炮到后方工厂全照顾到了。"
 flower_enemy_timestopped_idea:0 "§R防线遭闪电穿插瘫痪§!"
 flower_enemy_timestopped_idea_desc:0 "敌军装甲集群的突然穿插打乱了前线电台，部队调动陷入一片混乱。"
 flower_enemy_airspace_crushed_idea:0 "§R制空权遭全面压制§!"
 flower_enemy_airspace_crushed_idea_desc:0 "前线空军基地接连挨炸，战机难以起飞，地面部队暴露在敌机眼皮底下。"
 flower_enemy_intel_blind_idea:0 "§R战区电台遭夜战破译§!"
 flower_enemy_intel_blind_idea_desc:0 "密码本已被敌方夜战部队截获，夜间防线频频漏防、指挥处处慢人一步。"
 flower_night_first_strike_idea:0 "§1开战夜袭先机§!"
 flower_night_first_strike_idea_desc:0 "趁对手刚转入战时体制还没站稳脚跟，夜战部队借夜色发起30天先手突袭。"
 flower_dvl_ward_shield_idea:0 "§G超位魔法结界反制与抢修§!"
 flower_dvl_ward_shield_idea_desc:0 "防空结界与紧急疏散偏转了前两处核心落点，全国抢修队正连夜修复外围受损设施。"
 flower_proto_antigrav_tracks_idea:0 "§C实验原型：轻量化高速履带§!"
 flower_proto_antigrav_tracks_idea_desc:0 "实验室试制的复合材料履带跑起来又快又稳，只是耗油比老型号多出一些。"
 flower_proto_ammo_printer_idea:0 "§O实验原型：战地弹药速造车间§!"
 flower_proto_ammo_printer_idea_desc:0 "可移动弹药车间跟着炮兵一起往前挪，打起来管够，就是设备维护起来略微娇气。"
 flower_proto_weather_ctrl_idea:0 "§t实验原型：气象观测干预阵§!"
 flower_proto_weather_ctrl_idea_desc:0 "精密气象阵帮我军避开恶劣气候，还顺手把敌方战区搅进连绵90天的狂风暴雨。"
 flower_enemy_bad_weather_idea:0 "§R战区异常暴雨浓雾§!"
 flower_enemy_bad_weather_idea_desc:0 "前线连日暴雨夹着浓雾，道路泥泞不堪，机场也几乎无法正常起降。"
