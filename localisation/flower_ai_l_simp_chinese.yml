#新增6大开局畸变（7~12号）民族精神、决议与音效文案
 flower_anom7_base_idea:0 "三军听令，自刎归天！"
 flower_anom7_base_idea_desc:0 "胜券在握容易傲慢松懈，绝境反扑往往爆发出惊人血性。每当任意主要国家投降或灭亡，全图都会响起《关羽之歌》以送其最后一程。"
 flower_anom7_arrogant_idea:0 "骄兵必败"
 flower_anom7_arrogant_idea_desc:0 "顺风顺水连下数省之后，全军上下开始飘飘然，战壕都懒得认真挖了。"
 flower_anom7_desperate_1_idea:0 "哀兵初醒"
 flower_anom7_desperate_1_idea_desc:0 "眼看国土开始沦陷，前线官兵终于收起轻敌之心，在自家土地上愈战愈勇。"
 flower_anom7_desperate_2_idea:0 "背水一战"
 flower_anom7_desperate_2_idea_desc:0 "退无可退，全军上下破釜沉舟，在本土防线上拼命反推。"
 flower_anom7_desperate_3_idea:0 "自刎归天前夜"
 flower_anom7_desperate_3_idea_desc:0 "大势危如累卵，要么拼死翻盘，要么就听着《关羽之歌》壮烈谢幕！"
 flower_anom7_exhausted_idea:0 "强弩之末"
 flower_anom7_exhausted_idea_desc:0 "孤注一掷的透支冲锋结束后，全军筋疲力尽，后勤与士气急需喘息恢复。"
 flower_anom8_base_idea:0 "我是爷们儿！"
 flower_anom8_base_idea_desc:0 "断粮不慌，被围不怂，想撤退？真爷们腿脚迈不开后退的步子！"
 flower_anom8_boast_idea:0 "打肿脸充胖子"
 flower_anom8_boast_idea_desc:0 "越是面对强敌或内忧外患，嗓门就吼得越响亮，硬生生顶住了一波又一波攻势！"
 flower_anom9_base_idea:0 "全员拼好饭"
 flower_anom9_base_idea_desc:0 "军工消费全面降级：所有装备和飞机便宜到离谱，但可靠性也跟着打了折扣，每90天全图还会无缝轮换一盒战地外卖。"
 flower_anom9_meal_chicken_idea:0 "满减加鸡腿"
 flower_anom9_meal_chicken_idea_desc:0 "今天这顿拼好饭居然还给加了大鸡腿，全军吃得满嘴流油，行军速度都快了一截！"
 flower_anom9_meal_tech_idea:0 "科技与狠活"
 flower_anom9_meal_tech_idea_desc:0 "配料表长得吓人，吃完浑身使不完的牛劲，攻击猛增，只是装备和身子骨损耗得飞快。"
 flower_anom9_meal_late_idea:0 "骑手超时免单"
 flower_anom9_meal_late_idea_desc:0 "外卖超时直接免单白嫖，国库省下一大笔钱，前线憋着一肚子火猛冲敌阵，就是队形有点散。"
 flower_anom10_calm_idea:0 "从从容容，游刃有余"
 flower_anom10_calm_idea_desc:0 "和平岁月里搞基建、做科研、批文件样样顺心如意，就是压根没人认真准备打仗。"
 flower_anom10_panic_idea:0 "匆匆忙忙，连滚带爬"
 flower_anom10_panic_idea_desc:0 "炮火一响瞬间手忙脚乱！虽然防线有点慌乱，但逃跑和赶工爆产能的速度直接拉满！"
 flower_anom10_war_idea:0 "扛厂跑路体制"
 flower_anom10_war_idea_desc:0 "核心产区一旦失守，工人会连夜拆走1座工厂迁往后方核心地区重建，并将当地铁路和基础设施炸毁2级。"
 flower_anom11_base_idea:0 "孩子们，我回来了"
 flower_anom11_base_idea_desc:0 "天降伞兵与闪电登陆门槛大降，但满地防空炮和恶劣天气也让每一次升空都充满坠机刺激。"
 flower_anom12_base_idea:0 "回答我！看着我！"
 flower_anom12_base_idea_desc:0 "全图情报几乎透明，谁的底牌都藏不住。攻陷敌方首都或核心大城时，还能发动灵魂拷问让对手破防！"
 flower_anom12_speechless_idea:0 "被问到哑口无言"
 flower_anom12_speechless_idea_desc:0 "核心重镇惨遭攻陷并被当面质问，全国上下一时语塞，防线和密码体系双双动摇。"
 flower_anom12_interrogate_tech_bonus:0 "灵魂拷问审出的技术资料"
 flower_anomaly_v2_ops_cat:0 "畸变战时指令"
 flower_anomaly_v2_ops_cat_desc:0 "本局已开启特殊世界法则，可在战时关键节点下达孤注一掷的临时指令。"
 flower_anom7_ziwen_charge_dec:0 "三军听令，自刎归天！"
 flower_anom7_ziwen_charge_dec_desc:0 "消耗25点政治点数孤注一掷全线压上！未来30天内全军攻击与突破+25%、组织度恢复速率+30%、移动中组织度损失-50%；结束后将陷入60天【强弩之末】力竭状态（冷却180天）。"
 flower_anom8_yemen_roar_dec:0 "大喊：我是爷们儿！"
 flower_anom8_yemen_roar_dec_desc:0 "0政治点消耗！战时关键时刻亲手拍桌大吼一声“我是爷们儿！”，立刻爆发60天【打肿脸充胖子】硬汉攻防，稳住阵脚死扛强敌（冷却120天）。"
 flower_sfx_anomaly_7_ziwen:0 "自刎归天原声音效"
 flower_sfx_anomaly_7_guanyu_song:0 "关羽之歌全图悼念音效"
 flower_sfx_anomaly_8_yemen:0 "吴京我是爷们儿原声音效"
 flower_sfx_anomaly_9_pinhaofan:0 "拼好饭开盒音效"
 flower_sfx_anomaly_10_congrong:0 "从从容容连滚带爬原声音效"
 flower_sfx_anomaly_11_manba:0 "Man What can I say音效"
 flower_sfx_anomaly_12_look_eyes:0 "回答我Look in my eyes原声音效"
 flower_pao_player_lhs_win_idea:0 "拉普拉塔革命烽火"
 flower_pao_player_lhs_win_idea_desc:0 "拉普拉塔内战期间，野火阵线士气高涨，全力击破旧军团防线。"
 flower_pao_player_pau_yield_idea:0 "拉普拉塔防线动摇"
 flower_pao_player_pau_yield_idea_desc:0 "内战各线腹背受敌，军团后勤与前线指挥陷入被动。"
