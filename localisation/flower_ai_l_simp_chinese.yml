#新增6大开局畸变（7~12号）民族精神、决议与音效文案
 flower_anom7_base_idea:0 "三军听令，自刎归天！"
 flower_anom7_base_idea_desc:0 "顺风浪过头要挨揍，被逼到绝路反而能拼命翻盘。主要国家败亡时，还会响起《关羽之歌》送行。"
 flower_anom7_arrogant_idea:0 "骄兵必败"
 flower_anom7_arrogant_idea_desc:0 "顺风顺水连下好几个地区，全军上下都飘了，连战壕都懒得挖。"
 flower_anom7_desperate_1_idea:0 "哀兵初醒"
 flower_anom7_desperate_1_idea_desc:0 "老家开始丢地了，前线总算收起轻敌的心思，在自家地盘上死磕。"
 flower_anom7_desperate_2_idea:0 "背水一战"
 flower_anom7_desperate_2_idea_desc:0 "身后已经没多少退路，全军红着眼在本土防线上往回顶。"
 flower_anom7_desperate_3_idea:0 "自刎归天前夜"
 flower_anom7_desperate_3_idea_desc:0 "都快退到老家门口了，再不拼命就真要自刎归天了！"
 flower_anom7_exhausted_idea:0 "强弩之末"
 flower_anom7_exhausted_idea_desc:0 "一口气冲太猛把底子掏空了，部队和补给都得缓上一阵子。"
 flower_anom8_base_idea:0 "我是爷们儿！"
 flower_anom8_base_idea_desc:0 "被包饺子也不慌，反正撤退是不可能撤退的！"
 flower_anom8_boast_idea:0 "打肿脸充胖子"
 flower_anom8_boast_idea_desc:0 "嘴不能软，气势更不能输，死活先顶住这60天再说！"
 flower_anom9_base_idea:0 "全员拼好饭"
 flower_anom9_base_idea_desc:0 "军工采购全面拼单降价：枪炮飞机便宜得离谱，就是质量全看脸；每90天还会准点送来一盒战地外卖。"
 flower_anom9_meal_chicken_idea:0 "满减加鸡腿"
 flower_anom9_meal_chicken_idea_desc:0 "今天这顿拼好饭居然真给加了大鸡腿，吃饱喝足走路都带风！"
 flower_anom9_meal_tech_idea:0 "科技与狠活"
 flower_anom9_meal_tech_idea_desc:0 "配料表比作战计划还长，吃完浑身使不完的牛劲，就是太费人费枪。"
 flower_anom9_meal_late_idea:0 "骑手超时免单"
 flower_anom9_meal_late_idea_desc:0 "外卖超时直接免单白吃，省下一笔大钱，前线饿着肚子憋火猛冲，就是队形有点乱。"
 flower_anom10_calm_idea:0 "从从容容，游刃有余"
 flower_anom10_calm_idea_desc:0 "和平日子里盖厂、搞科研、批文件样样顺手，就是压根没人正经备战。"
 flower_anom10_panic_idea:0 "匆匆忙忙，连滚带爬"
 flower_anom10_panic_idea_desc:0 "炮声一响全乱套了！阵地还没站稳，倒是跑路和进厂赶工比谁都快。"
 flower_anom10_war_idea:0 "扛厂跑路体制"
 flower_anom10_war_idea_desc:0 "带工厂的核心地区一旦失守，工人会连夜拆走1座工厂搬回后方核心地区重建，顺手把当地铁路和基础设施各炸毁2级。"
 flower_anom11_base_idea:0 "孩子们，我回来了"
 flower_anom11_base_idea_desc:0 "伞兵和登陆队说走就走，就是遍地防空炮外加烂天气，飞机上天纯看命硬不硬。"
