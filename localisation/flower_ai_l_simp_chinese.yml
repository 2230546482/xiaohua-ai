#核心里程碑与畸变事件（严格零颜色码，清雅活人叙事）
 FLWAI.21.t:0 "记仇小本本写满啦！"
 FLWAI.21.d:0 "后勤处长抱着一摞翻卷了边的小本子推开会议室门，桌上很快摆满了从各条战线拆回来的光学瞄具、装甲钢板和整箱精密扳手。\n\n“每一笔缴获都记清了，连对面司令部的备用发电机都没落下。”他擦了擦手上的机油，把两份改装图纸摊在灯光下，“厂里这批好料留着可惜，您看是给步兵焊一套重装外骨骼，还是把全军野战维修网铺开？”"
 FLWAI.21.a:0 "战地外骨骼重装改造"
 FLWAI.21.b:0 "战地万能快修保障网"
 FLWAI.22.t:0 "黑心工厂全线通电！"
 FLWAI.22.d:0 "随着最后一排新厂房合上总闸，《基建狂魔的流水账》终于记满了整整五页。窗外烟囱冒着平稳的白烟，厂长拎着保温杯站在车间门口清点完日报，难得露出了笑脸。\n\n“机器转顺了，电费和原料都省下来一大截。”他把账本递给财政代表，“科研院那边听说账上有余钱，连夜就把扩编报告递上来了。”"
 FLWAI.22.a:0 "爽拿奖励！（£hcp_small +500）"
 FLWAI.23.t:0 "后院那颗怪蛋破壳啦！"
 FLWAI.23.d:0 "院子角落里那颗亮了整整二百七十天的大蛋，今天一早终于咔嚓裂开了口子。警卫员提着枪小心翼翼凑过去，只见碎蛋壳里滚出一件微烫的秘宝，底下还压着一张崭新的抽卡券。\n\n参谋们围着箱子小声议论起来：这宝贝带在身边只能定型成一种路数，究竟让它进工厂、上赌桌，还是送去科研院拆图？"
 FLWAI.23.a:0 "发条全自动兵工核（按储备补贴攻击与工厂产出，并扩建厂房）"
 FLWAI.23.b:0 "黄金王牌老千军团（把负面骰子甩给交战敌国）"
 FLWAI.23.c:0 "跨时代蓝图秘匣（科研突破与砸钱买兵买装备）"
 FLWAI.24.t:0 "半年军令状交作业啦！"
 FLWAI.24.d:0 "一百八十天期限一到，督战队队长准点敲开了办公室的门，手里捏着半年前按满红手印的那张军令状。\n\n屋里安静下来，桌上摊着最新的前线地图与工业报表。达标了自然论功行赏；要是没交上作业，酒杯已经摆在桌子边上了。"
 FLWAI.24.a:0 "军令状满分交卷，稳稳拿下！"
 FLWAI.24.b:0 "下次一定，自罚三杯重整旗鼓……"
 FLWAI.25.t:0 "全球交易所行情风暴！"
 FLWAI.25.d:0 "新年开市钟声刚刚敲响，交易大厅里的报价牌就噼里啪啦翻个不停。财政部的人端着热咖啡站在屏幕前，一边盯着军工股的买盘，一边盘算着今年该怎么动这笔钱。\n\n是借着大战风声拉高自家军工行情、联合大鳄砸盘做空宿敌，干脆拿着支票去海外买厂，还是稳稳落袋吃一波分红？"
 FLWAI.25.a:0 "满仓做多自家军工股（花费200储备）"
 FLWAI.25.b:0 "恶意做空头号宿敌（花费250储备）"
 FLWAI.25.c:0 "买断海外兵工厂（花费250储备）"
 FLWAI.25.e:0 "稳稳吃分红落袋（获得250储备）"
 FLWAI.26.t:0 "双修大成！觉醒时间到"
 FLWAI.26.d:0 "两条核心流派一路练到满级，演习场上各兵种磨合得严丝合缝。总参谋长合上评估报告，难得笑出了声。\n\n“两套绝活合到一处，这仗可就不按老黄历打了。”他把四份最终总纲推到桌前，“挑一套最趁手的拿去用吧。”"
 FLWAI.26.a:0 "移动火药库"
 FLWAI.26.b:0 "钞能力不死军团（£hcp_small +500）"
 FLWAI.26.c:0 "次元霸主"
 FLWAI.26.e:0 "暗夜游击敢死队"
 FLWAI.27.t:0 "将星武道会开打！"
 FLWAI.27.d:0 "新一届将星武道会在演武场鸣锣开打。台下各集团军的主官摩拳擦掌，都想趁着这次集训把自己的绝活再磨亮几分。\n\n今年要着重打磨哪一门本事，把自家主帅练成让对面头疼的狠角色？"
 FLWAI.27.a:0 "修习【万人敌】"
 FLWAI.27.b:0 "修习【空间魔术师】"
 FLWAI.27.c:0 "修习【大兵团棋手】"
 FLWAI.27.e:0 "修习【天选总座（微操之神）】"
 FLWAI.28.t:0 "对面的阵线被我们碾过去啦！"
 FLWAI.28.d:0 "前线装甲尖兵刚刚传来捷报：敌方主力已经停止抵抗，丢下满地的卡车、油桶与完好的野战跑道。工兵连一边清点战利品，一边问司令部接下来怎么乘胜追击。"
 FLWAI.28.a:0 "油门焊死，全军继续冲！"
 FLWAI.28.b:0 "缴获全套卡车，把油箱加满"
 FLWAI.28.c:0 "空地一起推，连夜扩建前线空军基地"

