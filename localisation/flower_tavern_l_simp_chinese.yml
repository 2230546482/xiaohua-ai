#64枚徽章卡面短摘要与悬停说明
 flower_st_arch_1_short:0 "攻占敌方工厂地区时\n缴获储备、步兵装备与经验"
 flower_st_arch_1_hub_tt:0 "§Y战利品拆解台§!\n§L缴获武器就地分拣整修，攻占工厂地区时还能顺带缴获储备与装备。§!\n--------------\n§C【1937小徽章】§!\n装备缴获比例系数：§G+20%§!\n陆军师损耗：§G-15%§!\n陆军组织度恢复：§G+15%§!\n\n§G★ 战场搜刮§!：战时每次攻占敌方带工厂地区（冷却30天），额外缴获§Y150储备§!、§G10陆军经验§!与§G300件步兵装备§!"
 flower_st_arch_2_short:0 "新建1座军用工厂\n每半年扩建核心地区"
 flower_st_arch_2_hub_tt:0 "§Y标准厂房蓝图§!\n§L统一厂房蓝图与换产流程，持续推进本土核心地区的工业扩建。§!\n--------------\n§C【1937小徽章】§!\n建设速度：§G+10%§!\n生产效率上限：§G+10%§!\n生产效率保持：§G+20%§!\n\n§G★ 标准扩建§!：领取后立刻在本土核心地区新建§G1座军用工厂§!；此后每180天免费为1个核心地区增加§G1个建筑槽位与1级基础设施§!"
 flower_st_arch_3_short:0 "战时每90天校射敌国\n削弱防御并破坏设施"
 flower_st_arch_3_hub_tt:0 "§Y炮兵观测气球§!\n§L升空的观测气球精确标定敌军火力点与工事，定期引导重炮校射。§!\n--------------\n§C【1937小徽章】§!\n炮兵攻击：§G+10%§!\n工事因战斗受损：§G+25%§!\n协同性：§G+10%§!\n\n§G★ 炮火校射§!：战时每90天锁定1个交战敌国，令其承受60天【炮火校射压制】（陆军师防御-10%、堑壕上限-25%、陆军组织度恢复-15%）并破坏其1级基础设施"
 flower_st_arch_4_short:0 "攻占敌方地区后触发\n60天装甲长途穿插"
 flower_st_arch_4_hub_tt:0 "§Y装甲燃油副箱§!\n§L加装副油箱后突击纵队航程大增，攻占据点即可补充油料继续推进。§!\n--------------\n§C【1937小徽章】§!\n装甲速度：§G+15%§!\n移动中组织度损失：§G-20%§!\n携行补给：§G+50小时§!\n\n§G★ 追击不断油§!：战时攻占敌方地区后触发60天【副油箱长途穿插】（装甲速度+15%、移动中组织度损失-20%、携行补给+50小时，冷却60天）"
 flower_st_arch_5_short:0 "诞生王牌或每120天\n触发90天机务极速整备"
 flower_st_arch_5_hub_tt:0 "§Y野战机务地勤组§!\n§L经验丰富的地勤班组大幅压缩检修时间，确保主力机群高频出动。§!\n--------------\n§C【1937小徽章】§!\n夺取制空权任务效率：§G+10%§!\n密接支援任务效率：§G+10%§!\n王牌飞行员产生几率：§G+50%§!\n\n§G★ 机务整备§!：每诞生王牌飞行员（冷却60天）或战时每120天，触发90天【机务极速整备】（夺取制空权任务效率、密接支援任务效率与对地攻击系数各+10%）并赠§G15空军经验§!"
 flower_st_arch_6_short:0 "战时每90天补充人力\n人力紧缺时补员翻倍"
 flower_st_arch_6_hub_tt:0 "§Y后备动员登记册§!\n§L详实的花名册让征召井然有序，前线吃紧时后备营能够迅速顶上。§!\n--------------\n§C【1937小徽章】§!\n可征募人口：§G+2%§!\n陆军师训练时间：§G-15%§!\n增援率：§G+10%§!\n\n§G★ 紧急征召§!：战时每90天紧急征召§G25000人力§!与§G20指挥点数§!；若当前人力不足30万，补员翻倍至§G50000人力§!"
 flower_st_arch_7_short:0 "开战与战时每半年\n致盲敌国侦查与夜战"
