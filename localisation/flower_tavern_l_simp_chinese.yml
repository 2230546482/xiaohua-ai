l_simp_chinese:
#开局游戏规则：流派轮换池模式
 RULE_FLOWER_TAVERN_POOL:0 "流派轮换池模式"
 RULE_OPTION_FLOWER_TAVERN_POOL_5:0 "每局随机开放5个流派（默认）"
 RULE_OPTION_FLOWER_TAVERN_POOL_5_DESC:0 "开局随机从12个流派中抽出5个作为本局开放池，玩家与主要国家共享同一流派池与徽章池，每把打法都不重样。"
 RULE_OPTION_FLOWER_TAVERN_POOL_12:0 "全开放12个流派"
 RULE_OPTION_FLOWER_TAVERN_POOL_12_DESC:0 "开局直接敞开全部12个流派，不设每局流派池限制。"

#动态修正名称
 flower_lightfang_dynamic_mod:0 "全军混编参谋部：多兵种协同"
 flower_bonds_ic_dynamic_mod:0 "国防公债认购书：储备产能"
 flower_magnetic_spec_dynamic_mod:0 "特战战术挂板：精锐增幅"

#基础底座、履约红利与违约惩戒精神
 flower_slayer_base_idea:0 "战地扒装备：以战养战"
 flower_slayer_base_idea_desc:0 "前线打完就地捡装备凑合用，后方常规产线自然跟着偷了点懒。"
 flower_gambler_base_idea:0 "黑市轮盘：高风险对赌"
 flower_gambler_base_idea_desc:0 "整天和地下中间人打交道，账上进项是漂亮，内阁脸色可就不太好看了。"
 flower_bm_default_penalty_idea:0 "§R黑市契约违约惩戒§!"
 flower_bm_default_penalty_idea_desc:0 "期限到了还没交上答卷，地下中间人二话不说就把信用额度给冻上了。"
 flower_bm_delivery_dividend_idea:0 "§G契约履约红利§!"
 flower_bm_delivery_dividend_idea_desc:0 "按时交卷挣足了脸面，中间人痛快返利，后方产线和账面跟着一起红火。"
 flower_wager_fail_penalty_idea:0 "§R军令状违约问责§!"
 flower_wager_fail_penalty_idea_desc:0 "立下的半年军令状没能兑现，前线士气和后方人心都免不了挨上一记闷棍。"

#1937小徽章（24枚）
 flower_st_arch_1:0 "战利品拆解台"
 flower_st_arch_1_desc:0 "缴获来的武器就地分拣整修，省得大老远拉回后方耽误工夫。"
 flower_st_arch_2:0 "标准厂房蓝图"
 flower_st_arch_2_desc:0 "厂房图纸和换产步骤全按一套标准来，扩建工期肉眼可见地紧凑起来。"
 flower_st_arch_3:0 "炮兵观测气球"
 flower_st_arch_3_desc:0 "升空的观测气球把对面火力点标得一清二楚，炮群打下去个个见响。"
 flower_st_arch_4:0 "装甲燃油副箱"
 flower_st_arch_4_desc:0 "多加装的副油箱让突击纵队敢往敌后深处大胆穿插，不用老惦记油表见底。"
 flower_st_arch_5:0 "野战机务地勤组"
 flower_st_arch_5_desc:0 "手脚麻利的老地勤把检修压到最短，每架战机落地歇口气就能再上天。"
 flower_st_arch_6:0 "后备动员登记册"
 flower_st_arch_6_desc:0 "花名册理得明明白白，新兵入伍和前线补员的流程顺畅了不少。"
 flower_st_arch_7:0 "微光夜视瞄具"
 flower_st_arch_7_desc:0 "黑灯瞎火反倒成了最好的掩护，先头部队专挑对面看不清的时候摸上去。"
 flower_st_arch_8:0 "敌后联络电台"
 flower_st_arch_8_desc:0 "藏在山林深处的短波电台把零散游击队串成了一张到处漏风的大网。"
 flower_st_arch_9:0 "战地输血急救包"
 flower_st_arch_9_desc:0 "火线抢救硬是把不少老兵骨干从鬼门关拉了回来，部队掉血没那么心疼了。"
 flower_st_arch_10:0 "特种精锐徽章"
 flower_st_arch_10_desc:0 "挑人挑得极狠的精锐徽章，别在胸口就代表着专啃最硬的骨头。"
 flower_st_arch_11:0 "实验记录本"
 flower_st_arch_11_desc:0 "写得密密麻麻的实验笔记替研究员绕开了一堆死胡同，新课题推进快多了。"
 flower_st_arch_12:0 "黑市信用筹码"
 flower_st_arch_12_desc:0 "地下交易所见了就认的纯金筹码，兜里揣着它随时能撬来急用的现钱。"
 flower_st_econ_ledger:0 "旧货当铺账本"
 flower_st_econ_ledger_desc:0 "精明的当铺估价本，卖卡多赚一笔回血，平时加抽战术卡也能省钱减冷却。"
 flower_st_econ_vip:0 "黑市贵宾折扣券"
 flower_st_econ_vip_desc:0 "揣着这张贵宾券进场直接打七五折，能替国库省下好大一笔冤枉钱。"
 flower_st_econ_outsource:0 "外包基建合同"
 flower_st_econ_outsource_desc:0 "请外部工程队分摊原料和换线压力，国内基建照样稳稳往前推。"
 flower_st_hyb_joint:0 "联合作战参谋部"
 flower_st_hyb_joint_desc:0 "把各兵种司令部拉到一张桌子上办公，多路夹击终于不再各打各的。"
 flower_st_hyb_combined:0 "多兵种协同操典"
 flower_st_hyb_combined_desc:0 "步兵、炮兵、装甲与空军按同一套节拍衔接，打起配合来顺手得很。"
 flower_st_port_general:0 "名将勋章盒"
 flower_st_port_general_desc:0 "打得好当场授勋嘉奖，前线指挥官在真刀真枪里涨起本事来飞快。"
 flower_st_port_railgun:0 "列车炮牵引调度令"
 flower_st_port_railgun_desc:0 "给重型列车炮一路开绿灯的铁路调度令，铁轨铺到哪儿重火力就跟到哪儿。"
 flower_st_port_thief:0 "战利品摸包手套"
 flower_st_port_thief_desc:0 "对面一溃退就顺手抄走更多战地档案，好东西总能多挑上几份。"
 flower_st_cursed_iou:0 "§R战时白条（诅咒）§!"
 flower_st_cursed_iou_desc:0 "拿白条先透支国库换来现钱和军工劲头，只是老百姓手头的日子紧了不少。"
 flower_st_cursed_dice:0 "§R破釜赌桌骰（诅咒）§!"
 flower_st_cursed_dice_desc:0 "孤注一掷的进攻号令打得又凶又急，国内舆论却跟着人心惶惶。"
 flower_st_cursed_laststand:0 "§R焦土死守令（诅咒）§!"
 flower_st_cursed_laststand_desc:0 "全军咬牙死守本土寸土不让，主动往外穿插的脚步自然慢了下来。"
 flower_st_cursed_austerity:0 "§R战时配给券（诅咒）§!"
 flower_st_cursed_austerity_desc:0 "大幅收紧后勤口粮与车间开工节奏，前线补给压力轻了大半，后方产线却也跟着慢了下来。"

#1939大徽章（24枚）
 flower_lt_arch_1:0 "全自动战地改装厂"
 flower_lt_arch_1_desc:0 "缴获的敌军装备连仓库都不用进，洗洗刷刷改个涂装直接拉回前线。"
 flower_lt_arch_2:0 "黑灯工业联合体"
 flower_lt_arch_2_desc:0 "整座工业枢纽昼夜连轴转，出货猛还省地方，后勤看了都要笑醒。"
 flower_lt_arch_3:0 "饱和弹幕计算仪"
 flower_lt_arch_3_desc:0 "机械火控仪把整条战线的炮弹落点算到分秒不差，对面连抬头都难。"
 flower_lt_arch_4:0 "银怀表引擎舱"
 flower_lt_arch_4_desc:0 "精密调校的动力舱让装甲集群跑得飞快，长途奔袭也不容易半道趴窝。"
 flower_lt_arch_5:0 "全空域预警网"
 flower_lt_arch_5_desc:0 "铺满战区的航空引导网让机群哪怕顶着坏天气照样精准出击。"
 flower_lt_arch_6:0 "永不枯竭预备役"
 flower_lt_arch_6_desc:0 "密密麻麻的后备兵源加上铁腕督战，阵线怎么打都漏不出缺口。"
 flower_lt_arch_7:0 "子夜幽灵旅徽"
 flower_lt_arch_7_desc:0 "专挑夜深人静摸上来的奇袭旅，把对面的航空侦察和掩护衬得像摆设。"
 flower_lt_arch_8:0 "野火全民武装"
 flower_lt_arch_8_desc:0 "每一座山头和村镇都藏着冷枪，侵略者踏进来一步就要脱一层皮。"
 flower_lt_arch_9:0 "战地复生急救车"
 flower_lt_arch_9_desc:0 "装甲急救车在炮火里来回穿梭，打残的连队喘口气又能拎枪顶上去。"
 flower_lt_arch_10:0 "王牌特战指挥印"
 flower_lt_arch_10_desc:0 "统筹海陆空三栖奇袭的精锐兵符，把特种突击集群送上决战最前沿。"
 flower_lt_arch_11:0 "全自动计算中心"
 flower_lt_arch_11_desc:0 "成排的机械计算设备日夜轰鸣，把实验室里的前瞻图纸飞快变成真家伙。"
 flower_lt_arch_12:0 "黑市庄家金印"
 flower_lt_arch_12_desc:0 "坐稳地下交易头把交椅，滚滚进账源源不断往军工和前线里砸。"
 flower_lt_econ_printer:0 "战时印钞模板"
 flower_lt_econ_printer_desc:0 "财政拨款批得毫不手软，军用工厂扩建和现金储备一起往上蹿。"
 flower_lt_econ_bonds:0 "国防公债认购书"
 flower_lt_econ_bonds_desc:0 "国库里攒下的高额储备信用直接折成实打实的工厂产出与建设速度。"
 flower_lt_econ_pivot:0 "灵活转产许可证"
 flower_lt_econ_pivot_desc:0 "中期保阶转型一分不花且间隔减半，换线扩厂也顺手得多。"
 flower_lt_hyb_lightfang:0 "全军混编参谋部"
 flower_lt_hyb_lightfang_desc:0 "现役兵种凑得越齐全，全军协同作战打出来的威力就越吓人。"
 flower_lt_hyb_triarms:0 "全军种协同印章"
 flower_lt_hyb_triarms_desc:0 "步兵、炮兵、装甲与空军齐头并进，合力撕开任何一条阵线。"
 flower_lt_port_museum:0 "战利品陈列馆"
 flower_lt_port_museum_desc:0 "每打垮一个强敌，不光能收走战利品，还能拓印对方的小徽章或换回一大笔储备。"
 flower_lt_port_marshal:0 "元帅权杖"
 flower_lt_port_marshal_desc:0 "把大兵团统筹全权交给前线主帅，整条战线的战役筹划水准水涨船高。"
 flower_lt_port_magnetic:0 "特战战术挂板"
 flower_lt_port_magnetic_desc:0 "手里常驻战术卡越多，精锐特种部队的战力和容量上限就堆得越高。"
 flower_lt_cursed_demon:0 "§R军工恶魔契约（诅咒）§!"
 flower_lt_cursed_demon_desc:0 "当场兑出大笔现钱并把军工拧到冒烟，代价是民怨和消费品账单一起炸锅。"
 flower_lt_cursed_cube:0 "§R禁忌实验魔方（诅咒）§!"
 flower_lt_cursed_cube_desc:0 "激进的装备和打法换来刀刀见肉的攻势，后勤和损耗表也跟着红成一片。"
 flower_lt_cursed_mortgage:0 "§R主权抵押协议（诅咒）§!"
 flower_lt_cursed_mortgage_desc:0 "拿国家信用做抵押换来大笔现钱与扩厂红利，代价是舆论微词不断、阵线韧性略微吃紧。"
 flower_lt_cursed_blood:0 "§R血税总动员（诅咒）§!"
 flower_lt_cursed_blood_desc:0 "背水一战的动员让本土阵线硬得像铁板，可部队机动慢得让人抓狂。"

#流派大成精神（12枚）
 flower_gold_arch_1:0 "§Y【流派大成】战地全回收霸主§!"
 flower_gold_arch_1_desc:0 "前线捡装备和后方改装合成一条龙，打得越久自家仓库反而越满。"
 flower_gold_arch_2:0 "§Y【流派大成】超级工业托拉斯§!"
 flower_gold_arch_2_desc:0 "整片工业腹地像上了发条一样昼夜轰鸣，钢铁洪流从厂房直通前线。"
 flower_gold_arch_3:0 "§Y【流派大成】大炮群轰灭体系§!"
 flower_gold_arch_3_desc:0 "观测、测绘与饱和轰击严丝合缝，炮口指到哪儿哪儿就成了犁过的地。"
 flower_gold_arch_4:0 "§Y【流派大成】时停装甲铁流§!"
 flower_gold_arch_4_desc:0 "装甲集群跑得比对面调防还快，往往守军刚反应过来后路已经被抄了。"
 flower_gold_arch_5:0 "§Y【流派大成】全域制空天幕§!"
 flower_gold_arch_5_desc:0 "地勤快、预警广、出击密，头顶这片天彻底成了自家后花园。"
 flower_gold_arch_6:0 "§Y【流派大成】无尽钢铁洪流§!"
 flower_gold_arch_6_desc:0 "动员册永远翻不到底，阵线前赴后继硬生生把对面耗到弹尽粮绝。"
 flower_gold_arch_7:0 "§Y【流派大成】永夜奇袭主宰§!"
 flower_gold_arch_7_desc:0 "只要太阳一落山，整条战线就成了奇袭部队单方面点名的主场。"
 flower_gold_arch_8:0 "§Y【流派大成】野火燎原之势§!"
 flower_gold_arch_8_desc:0 "电台一响漫山遍野全是伏兵，侵略者守到哪里哪里就在着火。"
 flower_gold_arch_9:0 "§Y【流派大成】不屈血炉军团§!"
 flower_gold_arch_9_desc:0 "打残就抢救、喘匀再冲锋，对面越打越心慌，自己越打越来劲。"
 flower_gold_arch_10:0 "§Y【流派大成】全能王牌特战§!"
 flower_gold_arch_10_desc:0 "编制束缚彻底撤除，满编精锐尖刀营走到哪儿都是战区里的定海神针。"
 flower_gold_arch_11:0 "§Y【流派大成】跨代科研奇迹§!"
 flower_gold_arch_11_desc:0 "前沿理论和实验室全速兑现，手里拿的装备比对手领先整整一截。"
 flower_gold_arch_12:0 "§Y【流派大成】黑市黄金霸权§!"
 flower_gold_arch_12_desc:0 "手握地下交易最高话语权，砸钱砸出来的胜势比炮弹还让人绝望。"

#1941超大徽章（4枚）
 flower_crown_war_machine:0 "§R【超大徽章】决战战争机器§!"
 flower_crown_war_machine_desc:0 "全国上下只围着决战这一件事转，前线推土机一样的攻势谁也拦不住。"
 flower_crown_grand_industry:0 "§Y【超大徽章】无尽工业巨擘§!"
 flower_crown_grand_industry_desc:0 "庞大的工业机器直接碾碎资源瓶颈，为全球大战源源不断吐出装备。"
 flower_crown_overlord_tech:0 "§C【超大徽章】跨代科技霸权§!"
 flower_crown_overlord_tech_desc:0 "尖端科研与战区情报全面占优，对手还没动弹底牌就已经被看穿了。"
 flower_crown_master_tactician:0 "§G【超大徽章】大兵团统帅§!"
 flower_crown_master_tactician_desc:0 "精密筹划配上久经沙场的老兵，整条战线调度起来如臂使指。"

#流派运营总控决议
 flower_tavern_refresh_dec:0 "【战术抽牌】抽取战术卡（免费券：[?flower_tavern_free_visits|0]）"
 flower_tavern_refresh_dec_desc:0 "有免费抽牌券优先用券，无券也可付费加抽一轮战术卡。"
 flower_tavern_refresh_free_tt:0 "消耗§Y1张§!免费抽牌券，立刻开启一轮战术卡抽取。"
 flower_tavern_buy_small_trinket_dec:0 "【1937小徽章】查看考核或买断"
 flower_tavern_buy_small_trinket_dec_desc:0 "当前考核进度：总工厂数[?num_of_factories|0]/[?flower_st_goal_fac|0]座｜控制地区[?num_controlled_states|0]/[?flower_st_goal_states|0]个｜战时陆军经验目标[?flower_st_goal_xp|0]点。"
 flower_tavern_buy_small_trinket_tt:0 "打开【徽章与考核总览】面板，查看实时进度、跳过考核买断或直接领取1937小徽章。"
 flower_tavern_reopen_lt_dec:0 "【1939大徽章】打开徽章面板选购"
 flower_tavern_reopen_lt_dec_desc:0 "1939大徽章展柜已就绪，集齐同流派大小徽章将自动晋升【流派大成】。"
 flower_tavern_reopen_lt_tt:0 "打开【徽章与考核总览】面板选购1939大徽章。"
 flower_tavern_pivot_dec:0 "【中期转型】保阶切换本局开放流派"
 flower_tavern_pivot_dec_desc:0 "保留当前流派阶位以及已建工厂、科研进度、装备库存和战术卡，直接切换到本局开放池里的另一条流派路线。"
 flower_tavern_pivot_tt:0 "打开本局开放池保阶转型菜单（持有【灵活转产许可证】免费且冷却减半）。"
 flower_tavern_open_bounty_dec:0 "【黑市悬赏】接取180天动态目标"
 flower_tavern_open_bounty_dec_desc:0 "地下中间人放出了新一期半年限期悬赏，按时交卷即可抱回赏金与免费抽牌券。"
 flower_tavern_open_bounty_tt:0 "依据当前年份、国力与已完成轮次下达180天三选一悬赏；达标可在【徽章与考核总览】第二页签当场领赏（本轮奖励[?flower_bounty_reward_hcp|0]储备、[?flower_bounty_reward_xp|0]陆军经验与1张免费抽牌券），逾期未成扣50政治点数。"
 flower_tavern_1941_crown_dec:0 "【1941超大徽章】打开徽章面板加冕"
 flower_tavern_1941_crown_dec_desc:0 "决战在即，四枚1941超大徽章已陈列就位，择一加冕即可奠定终局胜势。"
 flower_tavern_1941_crown_tt:0 "打开【徽章与考核总览】面板，消耗500储备与100政治点数加冕1941超大徽章。"

#徽章与流派运营事件：1937小徽章考核与选购
 FLWTV.1.t:0 "1937小徽章考核已下达"
