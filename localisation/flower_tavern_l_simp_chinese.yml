 FLOWER_BADGE_OWNED_LT_EMPTY_TT:0 "§C1939大徽章（尚未获得）§!\n--------------\n1939年6月开放4张候选选购；首张候选会优先匹配已持有的同源小徽章，凑齐即自动激活【流派大成】。\n每持有1张常驻战术卡可立减50储备报价（上限减200储备）。"
