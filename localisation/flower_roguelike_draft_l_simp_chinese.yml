#隐藏组合传闻
 FLOWER_HISTORY_COMBO_GUIDE_TT:0 "§Y私下打听来的隐藏组合传闻§!\n有些流派和词条凑在一块，会擦出意想不到的火花哦：\n--------------\n听说有人把战地敢死队配上了大基建工厂，前线竟跑成了全自动流水线；\n也有人借着夜色轰重炮、按下怀表打饱和齐射，或是让空军清场直接伞降对面首都；\n至于游击队怎么把敌人变成军火库、黑市老板怎么和五年计划坐庄分钱——剩下的才不剧透呢，自己在局里多混搭试试吧~"
