 FLOWER_DRAFT_GAMBLE_TT_HCP:0 "§R押筹码切牌§!（用完免费验牌后可用，每轮限1次）\n--------------\n库存军备不足，已自动切换黑市储备支付：\n£hcp_small 储备：§R-300§!\n£war_support_modifiericons_texticon 战争支持度：§R-5%§!\n立即重洗三张词条，提高核心词条出现概率；§G若额外流派卡不在冷却且未满4次，本次切牌必定刷出【小孩子才做选择】！§!"
