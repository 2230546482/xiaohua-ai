#隐藏组合传闻（点到为止，保留探索感）
 FLOWER_HISTORY_COMBO_GUIDE_TT:0 "§Y隐藏组合传闻§!\n有些流派与词条凑在一块，往往会擦出意想不到的火花：\n--------------\n听说有人把战地敢死队配上了大基建工厂，前线竟跑成了全自动流水线；\n也有人借着夜色打重炮、按下怀表搞饱和齐射，或是让空军清场直接伞降首都；\n至于游击队怎么把敌人变成军火库、黑市老板怎么和五年计划坐庄分钱——不妨在局里多试几种混搭，亲眼看看会撞出什么名堂。"
