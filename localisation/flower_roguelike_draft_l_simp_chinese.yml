 flower_draft_card_40_tt:0 "§R排水渠过河大法§!\n§L只要速度够快，河水就追不上我的履带！§!\n--------------\n§Y【派系归属】时停装甲闪电战（联动双刃契约）§!\n§Y【常驻属性】§!\n£cn_attacker_speed_texticon 渡河攻击惩罚：§G-30%§!   £supply_grace_texticon 携行补给：§G+100小时§!\n£attack_tank_texticon 装甲装备生产成本：§G-10%§!\n\n§G【流派联动机制】§!\n£cn_attacker_speed_texticon 每次发动【按下银怀表：时停穿插】，立刻将【闪电突击势头】直接拉满至最高级\n\n§R【双刃代价】§!\n£dig_in_max_texticon 堑壕上限：§R-25%§!   £defence_core_texticon 陆军师核心领土防御：§R-5%§!"
