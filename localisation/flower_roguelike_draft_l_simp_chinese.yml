 FLOWER_ARCH_CARD_3_S3_TT:0 "§R重炮洗地俱乐部（满级）§!\n§L二营长！你他娘的意大利炮呢？§!\n--------------\n£attack_artillery_texticon 炮兵攻击：§G+18%§!、炮兵防御：§G+16%§!、突破：§G+12%§!\n£coordination_texticon 协同性：§G+12%§!、计划加成上限：§G+14%§!、对主要国家的攻击：§G+10%§!、补给消耗：§R+8%§!\n解锁三级火炮、改进型火箭炮与自行火箭炮，立即获得：列车炮§G+2§!、牵引式火炮§G+3000§!、自行火箭炮§G+1000§!"
 FLOWER_ARCH_CARD_3_MAX_TT:0 "§R重炮洗地俱乐部（已满级）§!\n--------------\n£attack_artillery_texticon 牵引式火炮：§G+5000§!、£army_experience 陆军经验：§G+100§!"
 FLOWER_ARCH_CARD_4_S1_TT:0 "§C时停装甲闪电战（一阶）§!\n§L拖拉机焊两块钢板，也敢叫主战坦克！§!\n--------------\n§G★专属机制【闪电突击势头】§!：战时每攻占敌方地区自动叠加1层并补20000燃油（上限6层），停步超过1个月才会逐层回落。\n£attack_tank_texticon 装甲师攻击：§G+8%§!、装甲速度：§G+8%§!、陆军燃料消耗：§G-10%§!、计划速度：§G+15%§!\n解锁基础轻型与中型坦克底盘及摩托化步兵，立即获得：卡车§G+500§!、合成炼油厂§G+1§!、陆军经验§G+75§!"
