 FLOWER_HISTORY_COMBO_GUIDE_TT:0 "§Y私下打听来的隐藏组合传闻与徽章配合§!\n--------------\n有些流派和词条凑在一块，会擦出意想不到的火花哦：\n听说有人把战地敢死队配上了大基建工厂，前线竟跑成了全自动流水线；\n也有人借着夜色轰重炮、按下怀表打饱和齐射，或是让空军清场直接伞降对面首都；\n至于游击队怎么把敌人变成军火库、黑市老板怎么和五年计划坐庄分钱——已持有半套时会在本栏悄悄提示听牌线索哦！\n--------------\n§G徽章战术配合：§!同时持有徽章与常驻战术卡，可激活+5%至+15%陆军师组织度恢复速率与工厂产出；且每张常驻战术卡还会为1939大徽章立减50储备报价。"
