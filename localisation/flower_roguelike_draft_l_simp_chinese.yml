 #显性10组羁绊配方提示（悬停构筑图鉴状态栏随时查阅，零额外界面杂乱）
 FLOWER_HISTORY_COMBO_GUIDE_TT:0 "§Y全 10 组双流派羁绊配方总览§!\n同时拥有任意一组对应的两项流派/词条即可自动激活强力永久共鸣：\n--------------\n1. §G【亡灵血汗厂】§!: 躁动的亡灵 + 五年计划种田 / 血肉炼金\n2. §G【敌人给我们造】§!: 野火游击队 + 战地扒装备 / 黑市倒爷\n3. §G【永夜炮火洗礼】§!: 夜莺骑士团 + 0宽早苗炮 / 咲夜装甲\n4. §G【越打越起劲引擎】§!: 亡灵或人海 + 狂战换血 / 破釜沉舟\n5. §G【星际巨企飞碟】§!: 空军或飞碟 + 五年计划种田 / 凭本事借钱\n6. §G【幻想乡总动员】§!: 异界特种召唤 + 夜莺骑士团 / 妖精飞碟\n7. §G【时停饱和齐射】§!: 0宽早苗神风炮 + 咲夜时停装甲\n8. §G【天降神兵空骑】§!: 空军舔地洗头 + 异界特种召唤 / 伞兵遗物\n9. §G【以战养战永动机】§!: 战地扒装备 + 不死督战人海 / 战地华佗\n10. §G【黑市杠杆庄家】§!: 怪蛋黑市转盘 + 五年计划种田 / 黑市遗物"

