#词条卡37-60民族精神
 flower_card37_steal_warehouse_idea:0 "战利品的事能算偷吗"
 flower_card37_steal_warehouse_idea_desc:0 "每次发动【战地回炉车间】改为叠加2层《记仇小本本》并额外回收反坦克炮、防空炮与卡车各500；往后每次叠加《记仇小本本》都会自动折现进账200储备资金。"
 flower_card38_build_first_idea:0 "别打仗了先让我把厂盖完"
 flower_card38_build_first_idea_desc:0 "《基建狂魔的流水账》叠加门槛降至每新建10座工厂，每次叠层都会为核心地区扩建2格建筑槽与1级基础设施；每次发动【下达半年生产指标】额外返还200储备资金。"
 flower_card39_firepower_phobia_idea:0 "火力不足恐惧症"
 flower_card39_firepower_phobia_idea_desc:0 "发动【炮兵饱和弹幕总攻】火炮消耗减半，并额外多炸毁一轮敌方前沿陆上要塞与铁路。"
 flower_card40_gutter_river_idea:0 "排水渠过河大法"
 flower_card40_gutter_river_idea_desc:0 "每次发动【按下银怀表：时停穿插】，立刻将【闪电突击势头】直接拉满至最高级。"
 flower_card41_ace_combat_idea:0 "皇牌空战主角光环"
 flower_card41_ace_combat_idea_desc:0 "每次发动【全空域护航与机场压制洗地】，额外在交战前沿地区瞬建2级空军基地。"
 flower_card42_justice_rain_idea:0 "天降正义专业户"
 flower_card42_justice_rain_idea_desc:0 "正义从天而降——前提是别半路被防空炮点下来。"
 flower_card43_rifle_for_all_idea:0 "这次终于人手一把枪"
 flower_card43_rifle_for_all_idea_desc:0 "每次发动【切换战时总动员姿态】，当场补充50000人力与10000步兵装备。"
 flower_card44_bullets_vs_men_idea:0 "看你子弹多还是我人多"
 flower_card44_bullets_vs_men_idea_desc:0 "交战期间只要人力低于200000，每180天自动紧急征召100000预备役人力与10000步兵装备。"
 flower_card45_palace_wine_idea:0 "暗号：宫廷玉液酒"
 flower_card45_palace_wine_idea_desc:0 "每次发动【子夜奇袭令】，必定令随机主要敌国承受60天【战区电台遭假信号干扰】，同时返还25点指挥点数并摸走1张科研加速卡。"
 flower_card45_radio_jammed_idea:0 "战区电台遭假信号干扰"
 flower_card45_radio_jammed_idea_desc:0 "绝密频道里全是莫名其妙的暗号，前线参谋部一头雾水。"
 flower_card46_moon_awake_idea:0 "月亮不睡我不睡"
 flower_card46_moon_awake_idea_desc:0 "凌晨摸黑冲锋精神抖擞，太阳一出来全军困得不想挖战壕。"
 flower_card47_talking_trees_idea:0 "这片树林怎么在说话"
 flower_card47_talking_trees_idea_desc:0 "每次发动【发动敌后大破交】，额外顺走敌军500支援装备、500牵引式火炮与50000燃油，并同步破坏敌占我方核心区铁路与拉高抵抗度。"
 flower_card48_defib_full_hp_idea:0 "电击器一下就满血"
 flower_card48_defib_full_hp_idea_desc:0 "【战地救急爆发】攒点速度翻倍，爆发时额外提供50陆军经验并提拔1名现役将领；发动【开启战地血炉调度】不再消耗政治点数并补发500支援装备。"
 flower_card49_para_steal_cap_idea:0 "钢四传统艺能：伞兵偷家"
 flower_card49_para_steal_cap_idea_desc:0 "保持在60个陆军师以内时，每次发动【特种司令部调令】额外提拔1名现役将领并配发50架运输机与50艘运输船。"
 flower_card50_newton_coffin_idea:0 "牛顿的棺材板按不住了"
 flower_card50_newton_coffin_idea_desc:0 "每次发动【疯狂实验室专项课题】必定附赠随机1点突破点，且【科研成果转化】保底提升1级（上限保持5级）。"
 flower_card51_lord_of_war_idea:0 "战争之王的供货单"
 flower_card51_lord_of_war_idea_desc:0 "以后每次签订【黑市6个月净收入契约】，当场返还200储备资金。"
 flower_card52_pity_subsidy_idea:0 "非酋保底救助金"
 flower_card52_pity_subsidy_idea_desc:0 "每次【命运骰子】摇出负面结果时自动补贴300储备资金与50政治点数；发动【黑市赌桌筹码操作】费用减半并顺手清除当前负面骰子。"
 flower_card53_rich_mines_idea:0 "家里有矿就是硬气"
 flower_card53_rich_mines_idea_desc:0 "自家地底下什么矿都有，再也不用看外国资源商的脸色了。"
 flower_card54_tractor_factory_idea:0 "这真是农用拖拉机厂"
 flower_card54_tractor_factory_idea_desc:0 "别问为什么农用机械车间里堆满了炮弹壳，问就是准备秋收。"
 flower_card55_nine_inf_one_art_idea:0 "九步一炮还是纯步填线"
 flower_card55_nine_inf_one_art_idea_desc:0 "师编和载具图纸总算能放开手脚随便改个够了。"
 flower_card56_big_arrow_push_idea:0 "全线大突击"
 flower_card56_big_arrow_push_idea_desc:0 "微操什么微操，画条横跨大陆的进攻线点下执行直接包饺子！"
 flower_card57_steiner_hold_idea:0 "死守家门"
 flower_card57_steiner_hold_idea_desc:0 "施泰纳真的带着空投救兵落地了，先把家门口稳稳按住！"
 flower_card58_how_to_navy_idea:0 "海军是怎么玩的来着"
 flower_card58_how_to_navy_idea_desc:0 "搞不懂海战机制没关系，把造船厂全开堆满海权碾过去就行。"
 flower_card59_sealion_rush_idea:0 "海狮计划：登陆艇全速冲"
 flower_card59_sealion_rush_idea_desc:0 "管他海滩上埋了多少铁丝网，登陆艇直接顶上沙滩强行卸货！"
 flower_card60_surrender_radio_idea:0 "赶紧投降早打完早下班"
 flower_card60_surrender_radio_idea_desc:0 "处于战争状态每满120天，随机令1个交战主要敌国陷入60天【前线人心涣散】。"
 flower_card60_morale_broken_idea:0 "前线人心涣散"
 flower_card60_morale_broken_idea_desc:0 "前线高音喇叭整宿播着热饭香味和回家船票，战壕里的士气直线下滑。"

