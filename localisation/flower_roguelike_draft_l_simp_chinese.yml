 FLOWER_ARCH_CARD_1_TT:0 "§R战地扒装备§!\n§L你的装备很不错，下一秒归我了！§!\n--------------\n§G★专属机制【以战养战】§!：战时每攻占敌方带工厂地区（30天冷却），立刻缴获1200步兵装备、120牵引式火炮、80卡车与15000燃油。\n《记仇小本本》：§G+2层§!（上限8层，每层永久提供陆军师攻击+2%、突破+2%、陆军师组织度+1%、装备缴获比例系数+7.5%、补给消耗-2%、每周人力+600）\n立即获得：步兵装备§G+4000§!、牵引式火炮§G+500§!、支援装备§G+300§!\n--------------\n《记仇小本本》越写越厚，攒到一定层数还会开启进阶分支与额外惊喜。"
 FLOWER_ARCH_CARD_1_ACTIVE_TT:0 "§R战地扒装备（当前[?flower_slayer_stacks|0]层）§!\n§L你的装备很不错，下一秒归我了！§!\n--------------\n《记仇小本本》：§G+2层§!（属性上限8层）\n立即获得：步兵装备§G+4000§!、牵引式火炮§G+500§!、支援装备§G+300§!\n攒到3层时自动开启流派进阶分支。"
 FLOWER_ARCH_CARD_12_TT:0 "§Y黑市俄罗斯轮盘§!\n§L信黑市老板，还是信我是秦始皇？§!\n--------------\n§G★黑市大客户特权§!：签署【黑市半年净收入契约】直接打8折，并解锁独享的对赌契约。\n首次选择会从后院抱回一颗发光怪蛋（270天后破壳），同时立下一纸半年军令状。\n每次选择都会当场转动黑市轮盘（吃亏一次后下次必中头奖），并同步摇一轮持续180天的命运骰子。"
 FLOWER_ARCH_CARD_12_PITY_TT:0 "§G黑市俄罗斯轮盘（下次必中头奖！）§!\n§L信黑市老板，还是信我是秦始皇？§!\n--------------\n这次转动黑市轮盘§G100%必中头奖§!：科研槽+1、军用工厂+5、£hcp_small 储备+1000。\n同时会立刻重摇一轮命运骰子，并保留【黑市半年净收入契约】的8折优惠。"
 FLOWER_ARCH_CARD_2_S1_TT:0 "§C大基建五年计划（一阶）§!\n§L三班倒连轴转，厂里的灯从年头亮到年尾。§!\n--------------\n§G★专属机制【工业滚雪球】§!：每新建15座工厂自动叠加《基建狂魔的流水账》（上限8层，每层提供建设速度、工厂产出、生产效率上限与地区最大工厂数各+2%）。\n£production_efficiency_loss_texticon 生产效率保持：§G+25%§!、基础生产效率：§G+12%§!、建设速度：§G+8%§!\n立即获得：军用工厂§G+2§!、民用工厂§G+2§!、£hcp_small 储备§G+100§!"
 FLOWER_ARCH_CARD_2_S2_TT:0 "§C大基建五年计划（二阶）§!\n§L黑心工厂通电，厂里连电费都省了。§!\n--------------\n《基建狂魔的流水账》：§G+2层§!（上限8层）\n£production_efficiency_loss_texticon 生产效率保持：§G+35%§!、基础生产效率：§G+16%§!\n£consumer_goods_texticon 生活消费品工厂系数：§G-8%§!、工厂能源消耗：§G-25%§!、缺乏战略资源惩罚：§G-30%§!\n立即获得：军用工厂§G+2§!、民用工厂§G+2§!、£hcp_small 储备§G+100§!\n升至二阶时开启流派进阶分支。"
 FLOWER_ARCH_CARD_2_S3_TT:0 "§G大基建五年计划（满级）§!\n§L工业基础，产能就不基础！§!\n--------------\n《基建狂魔的流水账》：§G+2层§!（上限8层）\n£production_efficiency_loss_texticon 生产效率保持：§G+45%§!、生产效率上限：§G+12%§!\n£consumer_goods_texticon 生活消费品工厂系数：§G-10%§!、工厂能源消耗：§G-40%§!、缺乏战略资源惩罚：§G-45%§!\n£civ_factory_output 工厂产出：§G+14%§!\n立即获得：军用工厂§G+2§!、民用工厂§G+2§!、£hcp_small 储备§G+100§!"
 FLOWER_ARCH_CARD_2_MAX_TT:0 "§G大基建五年计划（已满级）§!\n--------------\n《基建狂魔的流水账》：§G+2层§!（上限8层）\n£mil_factory 军用工厂：§G+2§!、£civ_factory 民用工厂：§G+2§!、£hcp_small 储备：§G+100§!"
 FLOWER_ARCH_CARD_3_S1_TT:0 "§O重炮洗地俱乐部（一阶）§!\n§L真理只在射程之内。§!\n--------------\n§G★专属机制【重炮火力网】§!：根据全国牵引式火炮库存、陆军师数量与流派阶位动态提升炮兵攻击、突破与协同性。\n£attack_artillery_texticon 炮兵攻击：§G+8%§!、炮兵防御：§G+8%§!、协同性：§G+5%§!、计划加成上限：§G+6%§!\n解锁列车炮科技，立即获得：列车炮§G+2§!、牵引式火炮§G+1500§!"
