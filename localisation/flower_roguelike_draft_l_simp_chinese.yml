#词条卡37-60
 flower_draft_card_37_name:0 "§C战利品的事能算偷吗§!"
 flower_draft_card_37_quote:0 "§L缴获装备怎么能算偷，这叫战场物资再分配！§!"
 flower_draft_card_37_body:0 "£infantry_equipment_texticon 装备缴获比例系数：§G+10%§!\n§G★ 回炉联动§!：发动【战地回炉车间】叠双倍记仇，并追加反坦克炮、防空炮与卡车各 §G+500§!\n§Y★ 叠层折现§!：往后每叠新层《记仇小本本》，自动折现 £hcp_small 储备 §G+200§!"
 flower_draft_card_37_tt:0 "§C战利品的事能算偷吗§!\n§L缴获装备怎么能算偷，这叫战场物资再分配！§!\n--------------\n§O【派系归属】战地扒装备（流派机制联动）§!\n§Y【常驻属性】§!\n£infantry_equipment_texticon 装备缴获比例系数：§G+10%§!\n\n§G【流派联动机制】§!\n£infantry_equipment_text_icon 发动【战地回炉车间】改为叠加 §G2层§!《记仇小本本》，并额外回收反坦克炮 §G+500§!、防空炮 §G+500§!、卡车 §G+500§!\n£hcp_small 往后每次叠加新的《记仇小本本》层数，自动折现进账储备资金 §G+200§!"
 flower_draft_card_38_name:0 "§C别打仗了先让我把厂盖完§!"
 flower_draft_card_38_quote:0 "§L等会儿再宣战行不行，我这排工厂马上就建好了！§!"
 flower_draft_card_38_body:0 "£industry_repair_texticon 工厂修复速度：§G+25%§!\n§G★ 流水账提速§!：建厂叠层门槛由15座直降至 §G10座§!，每次叠层给核心地区扩建筑槽 §G+2§!、基础设施 §G+1级§!\n§Y★ 指标返现§!：发动【下达半年生产指标】返 £hcp_small §G+200§!"
 flower_draft_card_38_tt:0 "§C别打仗了先让我把厂盖完§!\n§L等会儿再宣战行不行，我这排工厂马上就建好了！§!\n--------------\n§G【派系归属】大基建五年计划（流派机制联动）§!\n§Y【常驻属性】§!\n£industry_repair_texticon 工厂修复速度：§G+25%§!\n\n§G【流派联动机制】§!\n£civ_factory 《基建狂魔的流水账》叠加门槛由每新建 15 座工厂直降至 §G每新建 10 座工厂§!\n£construction_speed_infrastructure_texticon 每次叠层自动为核心地区扩建建筑槽 §G+2§! 与基础设施 §G+1级§!\n£hcp_small 每次发动【下达半年生产指标】额外返还储备资金 §G+200§!"
 flower_draft_card_39_name:0 "§C火力不足恐惧症§!"
 flower_draft_card_39_quote:0 "§L管它对面躲在什么工事里，先按地图坐标犁一遍地再说！§!"
 flower_draft_card_39_body:0 "£attack_artillery_texticon 火炮、火箭炮、自行火炮与列车炮生产成本：§G-20%§!\n£construction_speed_landfort_texticon 攻击要塞伤害：§G+30%§!\n§G★ 弹幕联动§!：发动【炮兵饱和弹幕总攻】火炮消耗减半并追加一轮要塞与铁路爆破"
 flower_draft_card_39_tt:0 "§C火力不足恐惧症§!\n§L管它对面躲在什么工事里，先按地图坐标犁一遍地再说！§!\n--------------\n§O【派系归属】重炮洗地俱乐部（流派机制联动）§!\n§Y【常驻属性】§!\n£attack_artillery_texticon 牵引式火炮、火箭炮、自行火炮与列车炮生产成本：§G-20%§!\n£construction_speed_landfort_texticon 攻击要塞伤害：§G+30%§!\n\n§G【流派联动机制】§!\n£attack_artillery_texticon 发动【炮兵饱和弹幕总攻】火炮消耗减半（仅需 §G250门§!），并额外多炸毁一轮敌方前沿陆上要塞与铁路"
